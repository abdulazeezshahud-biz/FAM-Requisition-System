<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fbfbfc; --line:#e4e6ea;
  --line-strong:#cfd3d9; --ink:#161a20; --ink-2:#4a515b; --ink-3:#838b96;
  --brand:#C8102E; --brand-ink:#ffffff;
  --green:#16a34a; --green-bg:rgba(22,163,74,.12);
  --amber:#d97706; --amber-bg:rgba(217,119,6,.12);
  --red:#dc2626;   --red-bg:rgba(220,38,38,.12);
  --blue:#2563eb;  --blue-bg:rgba(37,99,235,.12);
  --slate:#64748b; --slate-bg:rgba(100,116,139,.12);
  --shadow:0 1px 2px rgba(16,20,28,.04),0 4px 16px rgba(16,20,28,.06);
  --shadow-lg:0 12px 40px rgba(16,20,28,.18);
  --radius:12px; --radius-sm:8px;
}
[data-theme="dark"]{
  --bg:#0c0e12; --surface:#14171d; --surface-2:#181c23; --line:#262b34;
  --line-strong:#343b46; --ink:#eef1f5; --ink-2:#b3bbc6; --ink-3:#7d8590;
  --brand-ink:#ffffff;
  --green-bg:rgba(22,163,74,.18); --amber-bg:rgba(217,119,6,.18);
  --red-bg:rgba(220,38,38,.18); --blue-bg:rgba(37,99,235,.18); --slate-bg:rgba(100,116,139,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  transition:.12s; white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(.93)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.dark:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.lg{padding:12px 20px;font-size:14px}
.btn.success{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:36px;height:36px;padding:0;border-radius:var(--radius-sm)}

/* ---------- badges / chips ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.2px;
  border:1px solid transparent;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%}
.b-green{background:var(--green-bg);color:var(--green)} .b-green .dot{background:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)} .b-amber .dot{background:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)} .b-red .dot{background:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)} .b-blue .dot{background:var(--blue)}
.b-slate{background:var(--slate-bg);color:var(--slate)} .b-slate .dot{background:var(--slate)}

/* ---------- login ---------- */
#login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;background:
   radial-gradient(1200px 600px at 80% -10%, rgba(200,16,46,.10), transparent 60%),
   var(--bg);
}
.login-card{
  width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;
}
.login-head{padding:32px 32px 22px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.crest{
  width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;
  letter-spacing:.5px;flex:none;overflow:hidden;
}
.crest.has-logo{background:#fff;border:1px solid var(--line);padding:5px}
.crest img{width:100%;height:100%;object-fit:contain}
.login-head h1{font-size:18px;font-weight:700;line-height:1.2}
.login-head p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.login-body{padding:24px 32px 30px}
.login-body .lbl{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px}
.demo-users{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.duser{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2);transition:.12s;text-align:left;width:100%;
}
.duser:hover{border-color:var(--brand);background:var(--surface)}
.av{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#fff;flex:none;
}
.duser .nm{font-weight:600;font-size:13.5px}
.duser .rl{font-size:11.5px;color:var(--ink-3)}
.login-foot{font-size:11px;color:var(--ink-3);text-align:center;padding:0 32px 22px;line-height:1.6}

/* ---------- app shell ---------- */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;
}
.tb-brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px}
.tb-brand .crest{width:34px;height:34px;border-radius:9px;font-size:13px}
.tb-brand .sub{font-size:11px;color:var(--ink-3);font-weight:500;display:block;margin-top:-2px}
.nav{display:flex;gap:2px;margin-left:8px;flex:1}
.nav-btn{
  display:flex;align-items:center;gap:7px;padding:9px 13px;border:none;background:none;color:var(--ink-2);
  font-size:13px;font-weight:600;border-radius:8px;position:relative;
}
.nav-btn svg{width:16px;height:16px}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{color:var(--brand);background:var(--brand);color:#fff}
.nav-btn.active svg{color:#fff}
.nav-btn .pill{
  background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:999px;
  min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
}
.nav-btn.active .pill{background:#fff;color:var(--brand)}
.tb-right{display:flex;align-items:center;gap:8px}
.umenu{position:relative}
.uchip{display:flex;align-items:center;gap:9px;padding:5px 9px 5px 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.uchip:hover{border-color:var(--line-strong)}
.uchip .av{width:28px;height:28px;border-radius:50%;font-size:12px}
.uchip .un{font-size:12.5px;font-weight:600;text-align:left;line-height:1.1}
.uchip .ur{font-size:10.5px;color:var(--ink-3)}
.dropdown{
  position:absolute;right:0;top:46px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-lg);min-width:210px;padding:6px;display:none;z-index:60;
}
.dropdown.open{display:block}
.dropdown .di{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:500;width:100%;border:none;background:none;text-align:left}
.dropdown .di:hover{background:var(--surface-2)}
.dropdown .di svg{width:15px;height:15px;color:var(--ink-3)}
.dropdown .sep{height:1px;background:var(--line);margin:5px 4px}

.hamb{display:none}
.main{max-width:1280px;width:100%;margin:0 auto;padding:24px 20px 60px}
.panel{display:none}
.panel.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.page-head .sub{font-size:13px;color:var(--ink-3);margin-top:3px}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.stat .k svg{width:14px;height:14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:9px}
.stat .v small{font-size:13px;font-weight:600;color:var(--ink-3)}
.stat .d{font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* ---------- card / table ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{font-size:14px;font-weight:700}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:7px 11px;background:var(--surface);min-width:200px}
.search svg{width:15px;height:15px;color:var(--ink-3)}
.search input{border:none;background:none;outline:none;color:var(--ink);font-size:13px;width:100%}
select.filter{border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:7px 10px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.4px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:.1s}
tbody tr:hover{background:var(--surface-2);cursor:pointer}
tbody tr:last-child td{border-bottom:none}
.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}
.req-no{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px}
.muted{color:var(--ink-3)}
.cell-strong{font-weight:600}
.trunc{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* progress chips for approval chain */
.chain-mini{display:flex;gap:4px;align-items:center}
.cm{width:9px;height:9px;border-radius:50%;background:var(--line-strong);position:relative}
.cm.ok{background:var(--green)}
.cm.no{background:var(--red)}
.cm.cur{background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}

.empty{padding:54px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:42px;height:42px;opacity:.4;margin-bottom:12px}
.empty p{font-size:13.5px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,10,14,.5);backdrop-filter:blur(3px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:30px 20px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:760px;animation:pop .18s;margin:auto}
.modal.wide{max-width:920px}
.modal.narrow{max-width:480px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:16px 16px 0 0}
.modal-head h3{font-size:17px;font-weight:700}
.modal-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.modal-body{padding:22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 16px 16px;flex-wrap:wrap}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.field label .req{color:var(--red)}
.input,.field input,.field select,.field textarea{
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;
  background:var(--surface);color:var(--ink);font-size:14px;outline:none;transition:.12s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,16,46,.12)}
.field textarea{resize:vertical;min-height:70px}
.hint{font-size:11.5px;color:var(--ink-3)}

/* ---------- admin / settings ---------- */
.admin-wrap{max-width:1040px}
input.filter{border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:7px 10px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;color-scheme:light}
.filter-bar{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr)) auto;gap:12px;align-items:end}
.filter-bar .field label{font-size:10.5px}
.filter-bar .field input,.filter-bar .field select{padding:8px 10px;font-size:13px;color-scheme:light}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.presets .chk-chip{padding:6px 11px;font-size:12px}
.report-sub{font-size:12.5px;color:var(--ink-3);margin:-8px 0 16px}
.kpi.accent .v{color:var(--brand)}
.kpi .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-chips .chk-chip{padding:6px 11px;font-size:12px}
@media(max-width:860px){.filter-bar{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.filter-bar{grid-template-columns:1fr}}
.admin-tabs{display:inline-flex;gap:2px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;flex-wrap:wrap}
.admin-tabs button{border:none;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.12s;white-space:nowrap}
.admin-tabs button:hover{color:var(--ink);background:var(--surface)}
.admin-tabs button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.acard-head{padding:18px 22px 0}
.acard-head h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.acard-head p{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.5;max-width:70ch}
.acard-body{padding:18px 22px}
.acard-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.acard-foot .spacer{flex:1}
.form-grid.cols3{grid-template-columns:repeat(3,1fr)}
.form-grid.cols4{grid-template-columns:repeat(4,1fr)}
/* chip list editor */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:38px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.chip.def{border-color:var(--brand);background:var(--red-bg)}
.chip .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--brand)}
.chip button{border:none;background:transparent;color:var(--ink-3);cursor:pointer;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;padding:0}
.chip button:hover{background:var(--surface-2);color:var(--red)}
.chip button.star:hover{color:var(--brand)}
.chip-add{display:flex;gap:8px;margin-top:12px;max-width:420px}
.chip-add input{flex:1}
/* choice chips (checkbox as pill) */
.chk-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px 8px 10px;font-size:13px;font-weight:500;cursor:pointer;user-select:none;background:var(--surface);transition:.12s}
.chk-chip:hover{border-color:var(--ink-3)}
.chk-chip input{width:auto;margin:0;accent-color:var(--brand)}
.chk-chip.on{border-color:var(--brand);background:var(--red-bg);color:var(--brand)}
.field label.chk-chip{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--ink)}
.field label.chk-chip.on{color:var(--brand)}
/* switch */
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:var(--line-strong);border-radius:999px;transition:.15s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i:before{transform:translateX(16px)}
/* chain editor rows */
.chain-row{display:grid;grid-template-columns:34px 1fr 1fr 170px 60px 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.chain-row:last-child{border-bottom:none}
.chain-row.head{padding:0 0 8px;font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.chain-row .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace}
.chain-row.off .n{background:var(--line-strong);color:var(--ink-2)}

<script>
const CFG = window.CONFIG;

/* ================= SETTINGS (admin-configurable, from req_settings) =================
   Everything that used to be hardcoded in CONFIG is overridden at boot from the
   PocketBase settings record and edited in the Admin tab. */
let SETTINGS=null, SETTINGS_ID=null;
function applySettings(S){
  if(!S) return; SETTINGS=S;
  if(S.reqPrefix) CFG.REQ_PREFIX=S.reqPrefix;
  if(Array.isArray(S.chain)&&S.chain.length) CFG.APPROVAL_CHAIN=S.chain;
  if(Array.isArray(S.vendorCategories)&&S.vendorCategories.length) CFG.VENDOR_CATEGORIES=S.vendorCategories;
  if(Array.isArray(S.currencies)&&S.currencies.length){ CFG.CURRENCIES=S.currencies; CFG.CURRENCY=S.currencies[0]; }
  if(Array.isArray(S.departments)&&S.departments.length) CFG.DEPARTMENTS=S.departments;
  CFG.TAX_RATES=Object.assign({gst:8,tgst:17},S.taxRates||{});
  CFG.GST_RATE=CFG.TAX_RATES.gst/100; CFG.GST_LABEL="GST "+CFG.TAX_RATES.gst+"%";
  CFG.QUOTES_REQUIRED=Number(S.quotesRequired)||3;
  CFG.THRESHOLD=Object.assign({enabled:false,amount:0,quotesRequired:1,steps:[]},S.threshold||{});
  CFG.ODOO=S.odoo||{}; CFG.SIGNATURE=Object.assign({allowPhysical:true},S.signature||{});
}
async function saveSettings(){
  if(!SETTINGS_ID||!window.__pb){ toast("Settings can only be saved in live mode",1); return false; }
  try{ await window.__pb.collection("req_settings").update(SETTINGS_ID,{data:SETTINGS}); applySettings(SETTINGS); toast("Settings saved"); return true; }
  catch(e){ toast(e?.message||"Could not save settings",1); return false; }
}
/* tax: none | gst | tgst (replaces the old GST on/off) */
function taxRate(t){ const R=CFG.TAX_RATES||{gst:8,tgst:17}; return t==="gst"?R.gst/100:t==="tgst"?R.tgst/100:0; }
function taxTypeOf(r){ return (r&&r.taxType)||(r&&r.gstApplied===false?"none":"gst"); }
function taxLabel(x){ const t=typeof x==="string"?x:taxTypeOf(x); const R=CFG.TAX_RATES||{gst:8,tgst:17}; return t==="gst"?"GST "+R.gst+"%":t==="tgst"?"TGST "+R.tgst+"%":"No tax"; }
/* low-value rule */
function subTotalOf(items){ return (items||[]).reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.rate)||0),0); }
function belowThreshold(o){ const T=CFG.THRESHOLD; if(!T||!T.enabled||!(Number(T.amount)>0)) return false; return subTotalOf(o&&o.items)<Number(T.amount); }
function quotesRequired(o){ if(o&&o.type&&o.type!=="purchase") return 0; return belowThreshold(o)?(Number(CFG.THRESHOLD.quotesRequired)||0):(CFG.QUOTES_REQUIRED||3); }
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];

/* ---------------- helpers ---------------- */
const uid = (p="id")=> p+"_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
/* CSPRNG-backed random hex (crypto.getRandomValues, unbiased). Used for
   approval-link tokens — the sole credential for the anonymous approval
   path — so they must not be predictable from Math.random()'s state. */
const randHex = (bytes=16)=>{ const a=new Uint8Array(bytes); crypto.getRandomValues(a); let s=""; for(let i=0;i<a.length;i++) s+=a[i].toString(16).padStart(2,"0"); return s; };

/* Strong, human-shareable one-time password (also CSPRNG). */
function genPassword(){ const a=new Uint8Array(12); crypto.getRandomValues(a); const cs="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<a.length;i++) s+=cs[a[i]%cs.length]; return s+"!"; }
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Escape a value for embedding inside a single-quoted JS string that itself

   for the JS-string layer FIRST, then HTML-escape — the reverse order (the
   old bug) let apostrophes and backslashes break out and run as script. */
const jsq = s => esc(String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'"));

/* ---------------- storage (graceful) ----------------
   Record DB: localStorage (persists on Netlify) -> sessionStorage -> memory.
   Quote files: IndexedDB (large quota) -> in-memory blob map fallback.
   When PB_URL is set, the LIVE block at the bottom takes over both.        */
const Store = (()=>{
  let mem={}; let target=null;
  const KEY="fam_req_v1";
  function probe(s){ try{ const k="__t"+Date.now(); s.setItem(k,"1"); s.removeItem(k); return true; }catch(e){ return false; } }
  if(typeof localStorage!=="undefined" && probe(localStorage)) target=localStorage;
  else if(typeof sessionStorage!=="undefined" && probe(sessionStorage)) target=sessionStorage;
  return {
    backed: !!target,
    persistent: target===(typeof localStorage!=="undefined"?localStorage:null),
    load(){ try{ return target ? JSON.parse(target.getItem(KEY)||"null") : (mem[KEY]||null); }catch(e){ return mem[KEY]||null; } },
    save(o){ const s=JSON.stringify(o); if(target){ try{ target.setItem(KEY,s); return; }catch(e){ /* quota / blocked */ } } mem[KEY]=o; }
  };
})();

/* IndexedDB file store for quote attachments (with in-memory fallback) */
const FileStore = (()=>{
  const DBN="fam_req_files", STORE="files"; let dbp=null; const mem=new Map();
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{
      try{
        if(typeof indexedDB==="undefined"){ rej("no-idb"); return; }
        const r=indexedDB.open(DBN,1);
        r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      }catch(e){ rej(e); }
    }).catch(()=>null);
    return dbp;
  }
  return {
    async put(id, blob){
      const db=await open();
      if(!db){ mem.set(id, blob); return; }
      return new Promise((res,rej)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(blob,id); tx.oncomplete=()=>res(); tx.onerror=()=>{ mem.set(id,blob); res(); }; });
    },
    async get(id){
      if(mem.has(id)) return mem.get(id);
      const db=await open();
      if(!db) return mem.get(id)||null;
      return new Promise((res)=>{ const tx=db.transaction(STORE,"readonly"); const rq=tx.objectStore(STORE).get(id); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); });
    },
    async del(id){
      mem.delete(id);
      const db=await open(); if(!db) return;
      return new Promise((res)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
    }
  };
})();
async function openFile(fileId, fileName, fileType){
  try{
    const blob=await FileStore.get(fileId);
    if(!blob){ toast("File not found in this browser",1); return; }
    const url=URL.createObjectURL(blob instanceof Blob ? blob : new Blob([blob],{type:fileType||"application/octet-stream"}));
    window.open(url,"_blank");
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast("Could not open file",1); }
}

function buildChain(o={}){
  // steps + order come from Admin → Approval chain (disabled steps are skipped;
  // the external step is off by default and can be removed entirely)
  let steps=(CFG.APPROVAL_CHAIN||[]).filter(s=>s.enabled!==false);
  if(o.type==="reimbursable" || o.type==="credit"){
    steps=steps.filter(s=>s.key==="dept_head"); // HOD pre-approval only (documents come later)
  } else if(belowThreshold(o)){
    // low-value rule: only the approvers admin ticked
    const keep=new Set((CFG.THRESHOLD&&CFG.THRESHOLD.steps)||[]);
    const f=steps.filter(s=>keep.has(s.key)); if(f.length) steps=f;
  }
  return steps.map(s=>({
    key:s.key, label:s.label, sublabel:s.sublabel, approverRole:s.approverRole,
    status:"pending", approverName:"", decidedAt:null, comment:"", signature:"", signMode:"", token:null
  }));
}

/* ---------------- status logic ---------------- */
function chainActive(req){ return req.chain.filter(s=>s.approverRole!=="external" || true); }
function isRejected(req){ return req.chain.some(s=>s.status==="rejected"); }
function approvedCount(req){ return req.chain.filter(s=>s.status==="approved").length; }
function fullyApproved(req){ return req.chain.length>0 && req.chain.every(s=>s.status==="approved"); }
function currentStepIndex(req){ // first pending step (after all previous approved)
  for(let i=0;i<req.chain.length;i++){ if(req.chain[i].status!=="approved") return i; }
  return -1;
}
function isOnHold(req){ return req.chain.some(s=>s.status==="hold"); }
function statusOf(req){
  if(req.mergedIntoId){ const p=DB.requisitions.find(x=>x.id===req.mergedIntoId); return {label:"Combined into "+(p?p.number:"another requisition"), cls:"b-slate", group:"merged"}; }
  if(req.convertedToId){ const p=DB.requisitions.find(x=>x.id===req.convertedToId); return {label:"Converted → "+(p?p.number:"requisition"), cls:"b-slate", group:"converted"}; }
  if(isRejected(req)) return {label:"Rejected", cls:"b-red", group:"rejected"};
  if(isOnHold(req)){
    const hs=req.chain.find(s=>s.status==="hold");
    return {label:"On hold — "+String(hs.sublabel||hs.label||"approver").split("/")[0].trim(), cls:"b-amber", group:"pending"};
  }
  if(!fullyApproved(req)){
    const i=currentStepIndex(req);
    const step=req.chain[i];
    return {label:"Awaiting "+(step?String(step.sublabel||step.label||"approval").split("/")[0].trim():"approval"), cls:"b-amber", group:"pending"};
  }
  // credit service requests: approved -> awaiting the bill/invoice
  if(req.type==="credit" && req.paymentStatus!=="paid"){
    if(req.invoiceStatus!=="received" && !(req.receipts&&req.receipts.length))
      return {label:"Approved · awaiting invoice", cls:"b-amber", group:"awaiting_invoice"};
    return {label:"Invoice received · unpaid", cls:"b-blue", group:"approved"};
  }
  if(req.paymentStatus!=="paid") return {label:"Approved · unpaid", cls:"b-blue", group:"approved"};
  if(req.odooStatus!=="posted") return {label:(req.type==="reimbursable"?"Reimbursed":"Paid")+" · awaiting Odoo", cls:"b-blue", group:"paid"};
  return {label:"Completed", cls:"b-green", group:"done"};
}
function isArchivedReq(r){ return !!(r.mergedIntoId||r.convertedToId); } // rolled into another record
function maybeComplete(req){
  if(fullyApproved(req) && req.paymentStatus==="paid" && req.odooStatus==="posted"){
    if(!req.completedAt) req.completedAt=new Date().toISOString();
  } else { req.completedAt=null; }
}

/* permission: can the current user sign this step? */
function canSignStep(req,step){
  if(!ME) return false;
  if(step.status!=="pending" && step.status!=="hold") return false; // held steps can still be decided
  // must be the current (next) step
  const i=req.chain.indexOf(step);
  if(i!==currentStepIndex(req)) return false;
  if(ME.role==="admin") return true;
  return (ME.approverRoles||[]).includes(step.approverRole);
}
/* can this user reopen a rejected / held step? */
function canReopenStep(req,step){
  if(!ME) return false;
  if(step.status!=="rejected" && step.status!=="hold") return false;
  if(ME.role==="admin"||ME.role==="finance") return true;
  return (ME.approverRoles||[]).includes(step.approverRole);
}

function lowestQuote(r){ const qs=validQuotes(r); if(!qs.length) return null; return qs.reduce((a,b)=>Number(b.amount)<Number(a.amount)?b:a); }

/* ----- criteria-based quote comparison ----- */
const QUOTE_CRITERIA=[
  { key:"price",    label:"Lowest price",              short:"lowest price" },
  { key:"delivery", label:"Fastest delivery",          short:"fastest delivery" },
  { key:"balanced", label:"Balanced — price + delivery", short:"best price-delivery balance" }
];
function criteriaLabel(key){ const c=QUOTE_CRITERIA.find(x=>x.key===key); return c?c.label:"Lowest price"; }
function fastestQuote(r){
  const qs=validQuotes(r).filter(q=>Number(q.deliveryDays)>0);
  if(!qs.length) return null;
  return qs.reduce((a,b)=>{
    const da=Number(a.deliveryDays), db=Number(b.deliveryDays);
    if(db<da) return b; if(db>da) return a;
    return Number(b.amount)<Number(a.amount)?b:a; // tie-break on price
  });
}
/* the quote the system recommends under this requisition's criteria */
function recommendedQuote(r){
  const crit=r.quoteCriteria||"price";
  const qs=validQuotes(r);
  if(!qs.length) return null;
  if(crit==="delivery") return fastestQuote(r)||lowestQuote(r);
  if(crit==="balanced"){
    const withD=qs.filter(q=>Number(q.deliveryDays)>0);
    if(withD.length<2) return lowestQuote(r); // not enough delivery data to balance
    const amts=withD.map(q=>Number(q.amount)), dels=withD.map(q=>Number(q.deliveryDays));
    const aMin=Math.min(...amts), aMax=Math.max(...amts), dMin=Math.min(...dels), dMax=Math.max(...dels);
    const norm=(v,lo,hi)=>hi-lo<0.0001?0:(v-lo)/(hi-lo);
    let best=null, bestScore=Infinity;
    for(const q of withD){
      const s=0.5*norm(Number(q.amount),aMin,aMax)+0.5*norm(Number(q.deliveryDays),dMin,dMax);
      if(s<bestScore){ bestScore=s; best=q; }
    }
    return best;
  }
  return lowestQuote(r);
}
function qDescr(r,q){
  const bits=[rmoney(r,q.amount)];
  if(Number(q.deliveryDays)>0) bits.push(`${q.deliveryDays}d delivery`);
  return `${quoteName(q)} (${bits.join(", ")})`;
}
/* verdict: does the selected quote match the recommendation for the chosen criteria? */
function quoteVerdict(r){
  const crit=r.quoteCriteria||"price";
  const qs=validQuotes(r);
  if(qs.length===0) return {state:"none", crit, msg:"No quotations attached yet."};
  const low=lowestQuote(r); const sel=selectedQuote(r); const best=recommendedQuote(r);
  const critNote = crit!=="price" && !qs.some(q=>Number(q.deliveryDays)>0)
    ? " (add delivery days to the quotes for a delivery-aware recommendation)" : "";
  if(!sel) return {state:"none", crit, low, best,
    msg:`${qs.length} quote${qs.length>1?'s':''} attached — none marked as selected. Recommended for ${QUOTE_CRITERIA.find(c=>c.key===crit).short}: ${qDescr(r,best)}.${critNote}`};
  if(best && sel.id===best.id){
    const extra = crit==="price" ? "" : ` Lowest price is ${qDescr(r,low)}.`;
    return {state:"ok", crit, low, sel, best, delta:0,
      msg:`Selected quote matches the recommendation for ${QUOTE_CRITERIA.find(c=>c.key===crit).short} — ${qDescr(r,sel)} (best of ${qs.length}).${sel.id!==low.id?extra:""}`};
  }
  const delta=+(Number(sel.amount)-Number(low.amount)).toFixed(2);
  return {state:"warn", crit, low, sel, best, delta,
    msg:`Selected ${qDescr(r,sel)} but the recommendation for ${QUOTE_CRITERIA.find(c=>c.key===crit).short} is ${qDescr(r,best)}${delta>0.001?` — selection is ${rmoney(r,delta)} above the lowest price`:""}.${critNote}`};
}

    const m=map[p]; m.count++; m.total+=r.total;
    const c=rcur(r); m.cur[c]=m.cur[c]||{total:0,paid:0}; m.cur[c].total+=r.total;
    if(r.paymentStatus==="paid"){ m.paid+=r.total; m.cur[c].paid+=r.total; }
    const g=statusOf(r).group;
    if(g==="pending") m.pending++; if(g==="done") m.done++;
  });
  const projs=Object.values(map).sort((a,b)=>b.total-a.total);
  const grandCur={};
  projs.forEach(p=>Object.entries(p.cur).forEach(([c,v])=>{ grandCur[c]=(grandCur[c]||0)+v.total; }));
  const grandStr=Object.entries(grandCur).map(([c,v])=>`${c} ${fmt(v)}`).join(" · ")||money(0);

  $("#panel-projects").innerHTML=`
    <div class="page-head"><div><h2>Projects</h2><div class="sub">Requisition spend grouped by project · ${grandStr} total</div></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
      ${projs.map(p=>{
        const curKeys=Object.keys(p.cur);
        const main=curKeys.sort((a,b)=>p.cur[b].total-p.cur[a].total)[0]||CFG.CURRENCY;
        const extra=curKeys.filter(c=>c!==main).map(c=>`${c} ${fmt(p.cur[c].total)}`).join(" · ");
        return `<div class="proj-card" onclick="filters={q:'',status:'',dept:'',project:'${jsq(p.name)}',payment:''};go('requisitions')" style="cursor:pointer">
        <div class="pn trunc">${esc(p.name)}</div>
        <div class="pv"><span style="font-size:13px;color:var(--ink-3)">${esc(main)}</span> ${fmt(p.cur[main]?p.cur[main].total:0)}${extra?`<span style="font-size:12px;color:var(--ink-3);font-weight:600"> + ${esc(extra)}</span>`:""}</div>
        <div class="pm">${p.count} requisition${p.count!==1?'s':''} · ${fmt(p.paid)} paid</div>
        <div class="bar"><i style="width:${p.total?Math.round(p.paid/p.total*100):0}%"></i></div>
        <div class="chips" style="margin-top:11px">
          ${p.pending?`<span class="badge b-amber"><span class="dot"></span>${p.pending} pending</span>`:""}
          ${p.done?`<span class="badge b-green"><span class="dot"></span>${p.done} done</span>`:""}
        </div>
      </div>`;}).join("")}
    </div>
  `;
}

/* ---------------- REPORTS ---------------- */
let reportState={ kind:"register", from:"", to:"", dept:"", type:"" };
const REPORT_KINDS=[
  { key:"register",  label:"Requisition register",        sub:"Every requisition & expense request in the period — the audit log" },
  { key:"budget",    label:"Spend by budget line",        sub:"Totals per chart-of-accounts code, suspense flagged" },
  { key:"project",   label:"Spend by project",            sub:"Totals per project, paid vs outstanding" },
  { key:"vendor",    label:"Spend by vendor",             sub:"Totals per payee vendor" },
  { key:"aging",     label:"Pending approvals & aging",   sub:"What's waiting, on whom, and for how long" },
  { key:"credit",    label:"Credit services & invoices",  sub:"Approved credit expenses and whether the vendor's bill has arrived" },
  { key:"monthly",   label:"Monthly summary",             sub:"Created / approved / paid totals per month" }
];
function reportReqs(){
  const s=reportState;
  return DB.requisitions.filter(r=>{
    if(s.from && r.date < s.from) return false;
    if(s.to && r.date > s.to) return false;
    if(s.dept && r.department!==s.dept) return false;
    if(s.type && (r.type||"purchase")!==s.type) return false;
    return true;
  }).sort((a,b)=> (a.date<b.date?-1:1));
}
function curTotals(rows, pick){ // per-currency totals string
  const m={};
  rows.forEach(r=>{ const c=rcur(r); m[c]=(m[c]||0)+(pick?pick(r):r.total); });
  return Object.entries(m).map(([c,v])=>`${c} ${fmt(v)}`).join(" · ")||"—";
}
function buildReport(){
  const rows=reportReqs(); const s=reportState;
  const period=`${s.from?dshort(s.from):"start"} → ${s.to?dshort(s.to):"today"}`;
  if(s.kind==="register"){
    return { title:"Requisition Register", period,
      cols:["Number","Date","Type","Department","Project","Payee","Budget line","Status","Payment","Cur","Total"],
      rows:rows.map(r=>[r.number,dshort(r.date),(r.type==="reimbursable"?"Expense":r.type==="credit"?"Credit":"Purchase"),r.department,r.project||"—",reqPayeeName(r)||"—",r.budgetLine?budgetLabel(r.budgetLine):"—",statusOf(r).label,(r.paymentStatus==="paid"?(r.type==="reimbursable"?"Reimbursed":"Paid"):"Unpaid"),rcur(r),fmt(r.total)]),
      numCols:[10], foot:`${rows.length} records · Grand total: ${curTotals(rows)}` };
  }
  if(s.kind==="budget"){
    const m={};
    rows.forEach(r=>{ const k=r.budgetLine||"(unassigned)"; m[k]=m[k]||{n:0,cur:{}}; m[k].n++; const c=rcur(r); m[k].cur[c]=(m[k].cur[c]||0)+r.total; });
    return { title:"Spend by Budget Line", period,
      cols:["Budget line","Requisitions","Totals"],
      rows:Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>[(k==="(unassigned)"?"(unassigned)":budgetLabel(k))+(k==="SUSPENSE"?"  ⚠":""),String(v.n),Object.entries(v.cur).map(([c,x])=>`${c} ${fmt(x)}`).join(" · ")]),
      numCols:[], foot:`${rows.length} records · ${curTotals(rows)}${m["SUSPENSE"]?` · ⚠ includes suspense spend pending reallocation`:""}` };
  }
  if(s.kind==="project"){
    const m={};
    rows.forEach(r=>{ const k=r.project||"(unassigned)"; m[k]=m[k]||{n:0,cur:{},paid:{}}; m[k].n++; const c=rcur(r); m[k].cur[c]=(m[k].cur[c]||0)+r.total; if(r.paymentStatus==="paid") m[k].paid[c]=(m[k].paid[c]||0)+r.total; });
    return { title:"Spend by Project", period,
      cols:["Project","Requisitions","Total","Paid","Outstanding"],
      rows:Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>[k,String(v.n),
        Object.entries(v.cur).map(([c,x])=>`${c} ${fmt(x)}`).join(" · "),
        Object.entries(v.paid).map(([c,x])=>`${c} ${fmt(x)}`).join(" · ")||"—",
        Object.entries(v.cur).map(([c,x])=>{const o=x-(v.paid[c]||0); return o>0.004?`${c} ${fmt(o)}`:null;}).filter(Boolean).join(" · ")||"—"]),
      numCols:[], foot:`${rows.length} records · ${curTotals(rows)}` };
  }
  if(s.kind==="vendor"){
    const m={};
    rows.forEach(r=>{ const k=reqPayeeName(r)||"(no payee)"; m[k]=m[k]||{n:0,cur:{}}; m[k].n++; const c=rcur(r); m[k].cur[c]=(m[k].cur[c]||0)+r.total; });
    return { title:"Spend by Vendor", period,
      cols:["Vendor / payee","Requisitions","Totals"],
      rows:Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>[k,String(v.n),Object.entries(v.cur).map(([c,x])=>`${c} ${fmt(x)}`).join(" · ")]),
      numCols:[], foot:`${rows.length} records · ${curTotals(rows)}` };
  }
  if(s.kind==="aging"){
    const open=rows.filter(r=>statusOf(r).group==="pending");
    return { title:"Pending Approvals & Aging", period,
      cols:["Number","Purpose","Currently with","Assigned to","Cur","Total","Days open","SLA"],
      rows:open.sort((a,b)=>daysBetween(b.createdAt,Date.now())-daysBetween(a.createdAt,Date.now())).map(r=>{
        const st=r.chain[currentStepIndex(r)]||{};
        const days=daysBetween(r.createdAt,Date.now())||0;
        const over=r.targetDays&&days>r.targetDays;
        return [r.number,r.purpose,(st.status==="hold"?"⏸ ":"")+(st.sublabel||"—"),st.approverName||"—",rcur(r),fmt(r.total),String(days),over?`⚠ over ${r.targetDays}d`:`${r.targetDays||"—"}d`];
      }),
      numCols:[5], foot:`${open.length} awaiting approval · value ${curTotals(open)}` };
  }
  if(s.kind==="credit"){
    const cr=rows.filter(r=>r.type==="credit");
    return { title:"Credit Services & Invoice Tracking", period,
      cols:["Number","Date","Department","Vendor","Purpose","Cur","Amount","Invoice","Status"],
      rows:cr.sort((a,b)=>(a.date<b.date?-1:1)).map(r=>{
        const st=statusOf(r);
        const hasBill=(r.receipts&&r.receipts.length)||r.invoiceStatus==="received";
        return [r.number,dshort(r.date),r.department,reqPayeeName(r)||"—",r.purpose,rcur(r),fmt(r.total),hasBill?"✓ received":(fullyApproved(r)?"⏳ awaiting":"—"),st.label];
      }),
      numCols:[6], foot:`${cr.length} credit requests · awaiting invoice: ${cr.filter(r=>fullyApproved(r)&&!((r.receipts&&r.receipts.length)||r.invoiceStatus==="received")).length} · value ${curTotals(cr)}` };
  }
  // monthly
  const m={};
  rows.forEach(r=>{ const k=(r.date||"").slice(0,7); m[k]=m[k]||{n:0,cur:{},paid:{},done:0}; m[k].n++; const c=rcur(r); m[k].cur[c]=(m[k].cur[c]||0)+r.total; if(r.paymentStatus==="paid") m[k].paid[c]=(m[k].paid[c]||0)+r.total; if(fullyApproved(r)) m[k].done++; });
  return { title:"Monthly Summary", period,
    cols:["Month","Created","Fully approved","Value created","Value paid"],
    rows:Object.entries(m).sort().map(([k,v])=>[k,String(v.n),String(v.done),
      Object.entries(v.cur).map(([c,x])=>`${c} ${fmt(x)}`).join(" · "),
      Object.entries(v.paid).map(([c,x])=>`${c} ${fmt(x)}`).join(" · ")||"—"]),
    numCols:[], foot:`${rows.length} records · ${curTotals(rows)}` };
}
function reportPreset(p){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth();
  const iso=x=>x.toISOString().slice(0,10);
  const s=reportState;
  if(p==="month"){ s.from=iso(new Date(y,m,1)); s.to=iso(new Date(y,m+1,0)); }
  else if(p==="last"){ s.from=iso(new Date(y,m-1,1)); s.to=iso(new Date(y,m,0)); }
  else if(p==="quarter"){ const q=Math.floor(m/3)*3; s.from=iso(new Date(y,q,1)); s.to=iso(new Date(y,q+3,0)); }
  else if(p==="year"){ s.from=`${y}-01-01`; s.to=`${y}-12-31`; }
  else { s.from=""; s.to=""; }
  renderReports();
}
function reportPresetActive(){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(), iso=x=>x.toISOString().slice(0,10), s=reportState;
  if(!s.from&&!s.to) return "all";
  if(s.from===iso(new Date(y,m,1))&&s.to===iso(new Date(y,m+1,0))) return "month";
  if(s.from===iso(new Date(y,m-1,1))&&s.to===iso(new Date(y,m,0))) return "last";
  const q=Math.floor(m/3)*3; if(s.from===iso(new Date(y,q,1))&&s.to===iso(new Date(y,q+3,0))) return "quarter";
  if(s.from===`${y}-01-01`&&s.to===`${y}-12-31`) return "year";
  return "";
}

  const active=reportPresetActive();
  const presets=[["month","This month"],["last","Last month"],["quarter","This quarter"],["year","This year"],["all","All time"]];

  $("#panel-reports").innerHTML=`
    <div class="page-head">

      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportCsv()">⬇ Export CSV</button><button class="btn primary" onclick="printReport()">${printIcon()} Print / PDF</button></div>

    <div class="admin-tabs" role="tablist">${REPORT_KINDS.map(k=>`<button role="tab" class="${s.kind===k.key?"on":""}" onclick="reportState.kind='${k.key}';renderReports()">${esc(k.label)}</button>`).join("")}</div>

    <div class="acard">

          <div class="field"><label>From</label><input type="date" value="${esc(s.from)}" onchange="reportState.from=this.value;renderReports()"></div>
          <div class="field"><label>To</label><input type="date" value="${esc(s.to)}" onchange="reportState.to=this.value;renderReports()"></div>
          <div class="field"><label>Department</label><select onchange="reportState.dept=this.value;renderReports()"><option value="">All departments</option>${CFG.DEPARTMENTS.map(d=>`<option ${s.dept===d?'selected':''}>${esc(d)}</option>`).join("")}</select></div>
          <div class="field"><label>Type</label><select onchange="reportState.type=this.value;renderReports()">
            <option value="">All types</option>
            <option value="purchase" ${s.type==='purchase'?'selected':''}>Purchase requisitions</option>
            <option value="reimbursable" ${s.type==='reimbursable'?'selected':''}>Expense requests</option>
            <option value="credit" ${s.type==='credit'?'selected':''}>Credit service requests</option></select></div>
          <div>${filtered?`<button class="btn ghost sm" onclick="reportState={kind:reportState.kind,from:'',to:'',dept:'',type:''};renderReports()">Clear filters</button>`:""}</div>
        </div>

      </div>
      <div class="acard-foot" style="padding-top:12px;padding-bottom:12px">
        <div class="kpi-row" style="margin:0;flex:1">
          <div class="kpi"><div class="k">Records</div><div class="v">${rows.length}</div><div class="s">${esc(rep.period)}</div></div>
          <div class="kpi accent"><div class="k">Total value</div><div class="v">${esc(curTotals(rows))}</div></div>
          <div class="kpi"><div class="k">Paid</div><div class="v">${esc(curTotals(paid))}</div><div class="s">${paid.length} record${paid.length===1?"":"s"}</div></div>
          <div class="kpi"><div class="k">Approved, unpaid</div><div class="v">${esc(curTotals(outstanding))}</div><div class="s">${outstanding.length} record${outstanding.length===1?"":"s"}</div></div>

        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h3>${esc(rep.title)}</h3><div class="hint" style="margin-top:3px">${esc(rep.period)}${s.dept?` · ${esc(s.dept)}`:""}${s.type?` · ${esc(typeLabel(s.type))}`:""}</div></div><span class="hint">${rep.rows.length} row${rep.rows.length===1?"":"s"}</span></div>

        <tbody>${rep.rows.length?rep.rows.map(row=>`<tr>${row.map((cell,i)=>`<td ${rep.numCols.includes(i)?'class="num"':''} style="font-size:12.5px">${esc(cell)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${rep.cols.length}"><div class="empty">${fileIcon()}<p>Nothing in this period.</p></div></td></tr>`}</tbody>
      </table></div>
      <div style="padding:12px 18px;border-top:1px solid var(--line);font-weight:700;font-size:12.5px;background:var(--surface-2)">${esc(rep.foot)}</div>
    </div>
  `;

let vendorFilter={q:"",cat:"",status:""};
function vendorSpend(vid){
  // total of requisitions paid to this vendor (by payeeVendorId or matching name)
  const v=vendorById(vid); let tot=0,cnt=0;
  DB.requisitions.forEach(r=>{ const isV = r.payeeVendorId===vid || (v && r.payee && r.payee.toLowerCase()===v.name.toLowerCase());
    if(isV){ tot+=r.total; cnt++; } });
  return {tot,cnt};
}

let vendorFormDocs={profile:null,gst:null};
const VDOC_LABEL={profile:"profile sheet",gst:"GST certificate"};
function renderVendorDocSlots(){
  for(const slot of ["profile","gst"]){
    const el=$("#vdoc_"+slot); if(!el) continue;
    const d=vendorFormDocs[slot];
    el.innerHTML = d
      ? `<span class="file-chip">${fileIconSm()}<span class="fn" title="${esc(d.fileName)}">${esc(d.fileName)}</span>${d.fileId&&!d._file?`<span style="cursor:pointer;margin-left:4px" onclick="openFile('${d.fileId}','${jsq(d.fileName||'')}','${esc(d.fileType||'')}')">${eyeIcon()}</span>`:""}<span class="rm" onclick="clearVendorDoc('${slot}')">×</span></span>`
      : `<label class="btn-file">${uploadIcon()} Attach<input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" style="display:none" onchange="pickVendorDoc('${slot}',this)"></label>`;
  }
}
function pickVendorDoc(slot, input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ toast("File too large (max 8 MB)",1); input.value=""; return; }
  vendorFormDocs[slot]={ fileId:"file_"+uid("f"), fileName:f.name, fileSize:f.size, fileType:f.type, _file:f };
  renderVendorDocSlots();
}
function clearVendorDoc(slot){ vendorFormDocs[slot]=null; renderVendorDocSlots(); }
async function saveVendor(id, returnTo){
  const g=x=>$("#"+x).value.trim();
  const name=g("v_name"); if(!name){ toast("Vendor name required",1); return; }
  // stage newly-picked documents into the file store
  for(const slot of ["profile","gst"]){
    const d=vendorFormDocs[slot];
    if(d&&d._file){ try{ await FileStore.put(d.fileId,d._file); }catch(e){} delete d._file; }
  }
  const docs={ profile:vendorFormDocs.profile||null, gst:vendorFormDocs.gst||null };
  const data={name,category:g("v_cat"),contact:g("v_contact"),phone:g("v_phone"),email:g("v_email"),
    regNo:g("v_reg"),address:g("v_addr"),bankName:g("v_bank"),bankAccount:g("v_acc"),accountName:g("v_accname"),
    status:g("v_status"),note:g("v_note"),docs};
  let vid=id;
  if(id){ const ex=DB.vendors.find(x=>x.id===id); data.fileMap=ex.fileMap||{}; Object.assign(ex,data); }
  else { const nv=Object.assign({id:uid("v"),fileMap:{}},data); DB.vendors.push(nv); vid=nv.id; }
  persist(); closeModal(); toast("Vendor saved");
  if(returnTo==="reqform"){ // came from requisition form — reopen it and select the new vendor where needed
    pendingVendorSelect=vid; reopenReqFormAfterVendor();
  } else { if(activeTab==="vendors") renderVendors(); else refreshAll(); }
}
function deleteVendor(id){
  const s=vendorSpend(id);
  const msg = s.cnt? `This vendor is referenced by ${s.cnt} requisition(s). They will keep the vendor's name on record. Continue?` : "Remove this vendor from the registry?";
  confirmModal("Delete vendor?",msg,()=>{ DB.vendors=DB.vendors.filter(x=>x.id!==id); persist(); closeModal(); renderVendors(); toast("Vendor deleted"); });
}

function onReqTypeChange(initial){
  const sel=$("#f_type"); if(!sel) return;
  const t=sel.value;
  const light = (t==="reimbursable"||t==="credit"); // no PO / no quotes / no external step
  if(!initial && !currentReqEditId){ $("#f_number").value=nextReqNumber(t); }
  $("#quotesSection").style.display = light?"none":"";
  $("#itemsTitle").textContent = t==="purchase"?"Items":"Estimated costs";
  $("#reqFormTitle").textContent = (currentReqEditId?"Edit ":"New ")+typeLabel(t).toLowerCase();
  const ph=$("#payeeHint"); if(ph) ph.textContent = t==="reimbursable"?"(who gets reimbursed — usually you)":(t==="credit"?"(vendor to be paid later on credit)":"(vendor to be paid)");
  const btn=$("#reqSubmitBtn"); if(btn) btn.textContent = currentReqEditId?"Save changes":(t==="purchase"?"Create requisition":t==="credit"?"Submit credit request":"Submit expense request");
  const probe={type:t, items:(typeof formItems!=="undefined"&&formItems)||[]};
  const steps=buildChain(probe);
  const low=t==="purchase"&&belowThreshold(probe);
  const qn=quotesRequired(probe);
  const tail = t==="reimbursable" ? " Once approved, incur the expense and attach the invoices/receipts here for reimbursement."
    : t==="credit" ? " The HOD approves the staff to incur this on credit; the vendor's bill/invoice is attached later, and the request can then be converted into a full requisition for payment."
    : (low?` <b>Low-value requisition</b> (below ${esc(CFG.CURRENCY)} ${fmt(CFG.THRESHOLD.amount)}): ${qn} quotation${qn!==1?'s':''} required.`:(qn?` ${qn} quotation${qn!==1?'s':''} required.`:""));
  $("#chainHint").innerHTML = `On save, the approval chain (${steps.length} step${steps.length!==1?'s':''}) is attached automatically: ${steps.map(s=>esc(s.sublabel)).join(" → ")}.${tail}`;
}

function renderQuoteVerdict(){
  const el=$("#quoteVerdict"); if(!el) return;
  const vd=quoteVerdict({quotes:formQuotes, quoteCriteria:val("f_qcriteria")||"price", currency:val("f_currency")||CFG.CURRENCY});
  if(vd.state==="none"){ el.innerHTML=`<div class="verdict none">${infoIcon()}<div>${esc(vd.msg)}</div></div>`; return; }
  if(vd.state==="ok"){ el.innerHTML=`<div class="verdict ok">${checkCircleIcon()}<div>${esc(vd.msg)}</div></div>`; return; }
  el.innerHTML=`<div class="verdict warn">${warnIcon()}<div>${esc(vd.msg)}
    <div style="margin-top:9px"><textarea id="f_qjust" placeholder="Justify why the lowest quote was not selected (approvers will see this)…" style="width:100%;min-height:58px" oninput="quoteJustDraft=this.value">${esc(quoteJustDraft||"")}</textarea></div>
  </div></div>`;
}
function addQuote(){ formQuotes.push(mkQuote({})); renderQuotes(); }
function rmQuote(i){ const q=formQuotes[i]; if(q.fileId&&!q._dirtyFile){ FileStore.del(q.fileId); } formQuotes.splice(i,1); renderQuotes(); }
const AUTO_ITEM_PREFIX="Supply as per quotation";
/* items are "safe to overwrite" when empty or previously seeded from a quote */
function itemsAreEmptyOrAutoSeeded(){
  if(!formItems.length) return true;
  if(formItems.length>1) return false;
  const it=formItems[0];
  return it.item.startsWith(AUTO_ITEM_PREFIX) || (!it.item.trim() && !(Number(it.rate)>0));
}
function selectQuote(i){
  formQuotes.forEach((q,j)=>q.selected=(j===i));
  const q=formQuotes[i];
  // 1. auto-fill the requisition's Payee (only if Payee is still empty)
  const sel=$("#f_payee");
  if(sel && !sel.value){
    if(q.vendorId){ sel.value=q.vendorId; toast("Payee set to "+vendorName(q.vendorId,"vendor")); }
    else if(q.vendorName){
      const v="legacy:"+q.vendorName;
      if(![...sel.options].some(o=>o.value===v)){
        const opt=document.createElement("option");
        opt.value=v; opt.textContent=q.vendorName+" (unregistered)";
        sel.insertBefore(opt, sel.options[1]||null);
      }
      sel.value=v; toast("Payee set to "+q.vendorName);
    }
  }
  // 2. fill the requisition amount from the selected quote (unless the user
  //    has itemised the requisition themselves)
  if(Number(q.amount)>0 && itemsAreEmptyOrAutoSeeded()){
    const vn = q.vendorId?vendorName(q.vendorId,""):(q.vendorName||"");
    formItems=[{ item:AUTO_ITEM_PREFIX+(vn?" — "+vn:""), qty:1, rate:Number(q.amount) }];
    // the quote amount is the vendor's all-in price, so set tax to none so the total matches exactly
    const g=$("#f_tax"); let gstNote="";
    if(g && g.value!=="none"){ g.value="none"; gstNote=" (tax set to none to match the quoted total)"; }
    renderItems(); renderTotals();
    const cur=val("f_currency")||CFG.CURRENCY;
    toast("Amount set from selected quote: "+cur+" "+fmt(q.amount)+gstNote);
  }
  renderQuoteVerdict();
}
async function pickQuoteFile(i, input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ toast("File too large (max 8 MB)",1); input.value=""; return; }
  const q=formQuotes[i];
  q._file=f; q.fileName=f.name; q.fileSize=f.size; q.fileType=f.type;
  q.fileId = q.fileId || ("file_"+uid("f")); q._dirtyFile=true;
  renderQuotes();
  // LIVE mode: have the backend AI read the document and pre-fill EMPTY fields
  if(window.__parseQuote){
    q._parsing=true; renderQuotes();
    try{
      const r=await window.__parseQuote(f);
      if(r){
        const filled=[];
        if(r.vendorName && !q.vendorId && !q.vendorName){
          const rn=r.vendorName.toLowerCase();
          const m=DB.vendors.find(v=>v.status!=="inactive" && (v.name.toLowerCase().includes(rn)||rn.includes(v.name.toLowerCase())));
          if(m){ q.vendorId=m.id; filled.push(m.name); }
          else { q.vendorName=r.vendorName; filled.push(r.vendorName); }
        }
        if(Number(r.amount)>0 && !(Number(q.amount)>0)){ q.amount=r.amount; filled.push((r.currency?r.currency+" ":"")+fmt(r.amount)); }
        if(Number(r.deliveryDays)>0 && !(Number(q.deliveryDays)>0)){ q.deliveryDays=r.deliveryDays; filled.push(r.deliveryDays+"d delivery"); }
        if(r.note && !q.note){ q.note=r.note; }
        const cur=val("f_currency")||CFG.CURRENCY;
        if(r.currency && r.currency!==cur){ toast(`Heads up: this quote looks like ${r.currency}, but the requisition is in ${cur}`,1); }
        if(filled.length) toast("Read from document: "+filled.join(" · ")+" — please verify");
      }
    }catch(err){
      if(err && err.status===503) toast("AI document reading isn't configured yet — fill in the quote manually",1);
      else console.warn("parse-quote failed", err);
    }
    q._parsing=false; renderQuotes();
  }
}
function clearQuoteFile(i){ const q=formQuotes[i]; if(q.fileId&&!q._dirtyFile) q._removeFile=q.fileId; q._file=null; q.fileName=""; q.fileSize=0; q.fileType=""; q.fileId=null; q._dirtyFile=false; renderQuotes(); }
async function flushQuoteFiles(quotes){
  for(const q of quotes){
    if(q._removeFile){ try{ await FileStore.del(q._removeFile); }catch(e){} }
    if(q._dirtyFile && q._file && q.fileId){ try{ await FileStore.put(q.fileId, q._file); }catch(e){} }
    delete q._file; delete q._dirtyFile; delete q._removeFile;
  }
}

/* ----- add a vendor without losing the requisition form ----- */
function captureReqForm(){
  reqDraft={ editId: currentReqEditId, fields:{
    number:val("f_number"), date:val("f_date"), dept:val("f_dept"),
    project:val("f_project"), payee:val("f_payee"), prep:val("f_prep"), target:val("f_target"), purpose:val("f_purpose"),
    type:val("f_type")||"purchase", currency:val("f_currency"), budget:val("f_budget"), qcriteria:val("f_qcriteria")||"price",
    tax: val("f_tax")||"gst"
  }};
}
function addVendorForReq(type, idx){ captureReqForm(); vendorTarget={type,idx}; openVendorForm(null,"reqform"); }
function reopenReqFormAfterVendor(){
  if(vendorTarget && pendingVendorSelect){
    if(vendorTarget.type==="payee"){ reqDraft.fields.payee=pendingVendorSelect; }
    else if(vendorTarget.type==="quote"){ formQuotes[vendorTarget.idx].vendorId=pendingVendorSelect; formQuotes[vendorTarget.idx].vendorName=""; }
  }
  openReqForm(reqDraft.editId, reqDraft);
  pendingVendorSelect=null; vendorTarget=null; reqDraft=null;
}
function renderItems(){
  $("#itemsWrap").innerHTML=`<table class="items-table">
    <thead><tr><th style="width:48%">Item</th><th style="width:90px">Qty</th><th style="width:130px">Rate (${CFG.CURRENCY})</th><th style="width:130px;text-align:right">Amount</th><th style="width:36px"></th></tr></thead>
    <tbody>${formItems.map((it,i)=>`<tr>
      <td><input value="${esc(it.item)}" oninput="formItems[${i}].item=this.value" placeholder="Description"></td>
      <td><input type="number" min="0" step="any" value="${it.qty}" oninput="formItems[${i}].qty=this.value;renderTotals();updateAmt(${i})"></td>
      <td><input type="number" min="0" step="any" value="${it.rate}" oninput="formItems[${i}].rate=this.value;renderTotals();updateAmt(${i})"></td>
      <td class="ti-amt" id="amt_${i}">${fmt((Number(it.qty)||0)*(Number(it.rate)||0))}</td>
      <td>${formItems.length>1?`<button class="rm-row" onclick="rmItem(${i})">${xIcon(13)}</button>`:""}</td>
    </tr>`).join("")}</tbody></table>`;

}
function updateAmt(i){ const it=formItems[i]; const el=$("#amt_"+i); if(el) el.textContent=fmt((Number(it.qty)||0)*(Number(it.rate)||0)); }
function renderTotals(){
  const sub=formItems.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.rate)||0),0);
  const tt=$("#f_tax")?$("#f_tax").value:"gst";
  const gst=sub*taxRate(tt); const tot=sub+gst;
  const cur=val("f_currency")||CFG.CURRENCY;
  $("#totalsWrap").innerHTML=`<div class="totals">
    <div class="tr"><span>Sub Total</span><span class="num">${fmt(sub)}</span></div>
    ${tt!=="none"?`<div class="tr"><span>${esc(taxLabel(tt))}</span><span class="num">${fmt(gst)}</span></div>`:`<div class="tr"><span class="muted">No tax applied</span><span class="num muted">—</span></div>`}
    <div class="tr grand"><span>Total (${esc(cur)})</span><span class="num">${fmt(tot)}</span></div>
  </div>`;
  // amounts drive the low-value rule — keep the chain/quotes hint current
  if($("#chainHint")&&$("#f_type")){ try{ onReqTypeChange(true); }catch(e){} }
}
function addItem(){ formItems.push({item:"",qty:1,rate:0}); renderItems(); }
function rmItem(i){ formItems.splice(i,1); renderItems(); }

function nextReqNumber(type){
  const y=new Date().getFullYear();
  const prefix=`${typePrefix(type)}/${y}/`;
  const norm=t=>t||"purchase";
  const pool=DB.requisitions.filter(r=> norm(r.type)===norm(type));
  let max=0;
  pool.forEach(r=>{ if(r.number.startsWith(prefix)){ const n=parseInt(r.number.slice(prefix.length),10); if(!isNaN(n)&&n>max)max=n; } });
  if(max===0){ // fall back to global max across years for continuity
    pool.forEach(r=>{ const m=r.number.match(/\/(\d+)$/); if(m){ const n=+m[1]; if(n>max)max=n; } });
  }
  return prefix+String(max+1).padStart(3,"0");
}

async function saveReq(editId){
  const get=id=>$("#"+id).value.trim();
  // resolve payee select -> vendorId + name
  const payeeSel=get("f_payee"); let payeeVendorId="", payeeName="";
  if(payeeSel.startsWith("legacy:")){ payeeName=payeeSel.slice(7); }
  else if(payeeSel){ payeeVendorId=payeeSel; payeeName=vendorName(payeeSel,""); }
  // clean quotes (strip temp fields, resolve names, drop empty rows)
  const cleanQuotes=formQuotes
    .filter(q=> q.vendorId || q.vendorName || Number(q.amount)>0 || q.fileId)
    .map(q=>({ id:q.id||uid("q"), vendorId:q.vendorId||"", vendorName: q.vendorId?"":(q.vendorName||""),
      amount:Number(q.amount)||0, deliveryDays:Number(q.deliveryDays)||null, fileId:q.fileId||null, fileName:q.fileName||"", fileSize:q.fileSize||0,
      fileType:q.fileType||"", note:q.note||"", selected:!!q.selected }));
  const fType=$("#f_type")?$("#f_type").value:"purchase";
  const light=(fType==="reimbursable"||fType==="credit"); // no quotes
  const fTax=$("#f_tax")?$("#f_tax").value:"gst";
  const qCrit=get("f_qcriteria")||"price";
  const data={
    number:get("f_number"), date:get("f_date"), department:get("f_dept"),
    type:fType, currency:get("f_currency")||CFG.CURRENCY, budgetLine:get("f_budget"),
    quoteCriteria:qCrit, taxType:fTax,
    poNumber:"", project:get("f_project"), purpose:get("f_purpose"),
    payee:payeeName, payeeVendorId, preparedBy:get("f_prep"), preparedDate:get("f_date"),
    targetDays:+get("f_target")||7,
    items:formItems.map(i=>({item:i.item.trim(),qty:Number(i.qty)||0,rate:Number(i.rate)||0})).filter(i=>i.item),
    quotes:light?[]:cleanQuotes,
    quoteJustification: (!light && quoteVerdict({quotes:cleanQuotes, quoteCriteria:qCrit}).state==="warn") ? (quoteJustDraft||"") : ""
  };
  if(!data.date||!data.purpose||!data.preparedBy){ toast("Fill in date, purpose and prepared-by",1); return; }
  if(!data.items.length){ toast("Add at least one item",1); return; }
  // quotation requirement (3 by default; fewer under the low-value rule — Admin tab)
  if(!light){
    const need=quotesRequired({type:fType, items:data.items});
    const have=cleanQuotes.filter(q=>Number(q.amount)>0).length;
    if(have<need){ toast(`This requisition needs ${need} quotation${need!==1?'s':''} with an amount (${have} attached)`,1); return; }
  }

  await flushQuoteFiles(formQuotes); // write attachments to the file store

  if(editId){
    const r=DB.requisitions.find(x=>x.id===editId);
    delete data.type; // type is fixed after creation
    const sub=data.items.reduce((s,i)=>s+i.qty*i.rate,0);
    const gstAmt=+(sub*taxRate(fTax)).toFixed(2);
    Object.assign(r,data,{subTotal:sub,gstAmount:gstAmt,total:+(sub+gstAmt).toFixed(2),gstApplied:fTax!=="none"});
    // amount changes may move the requisition across the low-value threshold and
    // so change the required approvers — rebuild only while nothing is signed yet
    if(r.type==="purchase" && r.chain.every(s=>s.status==="pending")){
      const fresh=buildChain({type:r.type, items:r.items});
      if(fresh.map(s=>s.key).join()!==r.chain.map(s=>s.key).join()){
        const keep=Object.fromEntries(r.chain.map(s=>[s.key,s.token]));
        r.chain=fresh; r.chain.forEach(s=>{ if(keep[s.key]) s.token=keep[s.key]; });
      }
    }
    persist(); closeModal(); openReq(editId); toast(typeLabel(r.type)+" updated");
  } else {
    // provisional number for display — the SERVER assigns the final number from
    // the admin-managed sequence when the record is saved (no duplicates)
    data.number = nextReqNumber(fType);
    if(fType==="credit") data.invoiceStatus="awaiting";
    const r=makeReq(Object.assign(data,{createdAt:new Date().toISOString()}));
    DB.requisitions.unshift(r); persist(); closeModal(); openReq(r.id);
    toast(typeLabel(fType)+" "+r.number+" created");
  }
  refreshAll();
}

/* ---------------- REQUISITION DETAIL ---------------- */
function quotesBlock(r){
  const qs=(r.quotes||[]);
  if(!qs.length) return `<div class="verdict none">${infoIcon()}<div>No quotations attached to this requisition.</div></div>`;
  const vd=quoteVerdict(r); const low=lowestQuote(r); const best=recommendedQuote(r);
  const vclass=vd.state==="ok"?"ok":vd.state==="warn"?"warn":"none";
  const vicon=vd.state==="ok"?checkCircleIcon():vd.state==="warn"?warnIcon():infoIcon();
  const hasDelivery=qs.some(q=>Number(q.deliveryDays)>0);
  const rows=qs.slice().sort((a,b)=>(Number(b.amount)>0?1:0)-(Number(a.amount)>0?1:0)||Number(a.amount)-Number(b.amount)).map(q=>{
    const isLow=low&&q.id===low.id&&Number(q.amount)>0;
    const isBest=best&&q.id===best.id&&Number(q.amount)>0;
    return `<tr class="${q.selected?'is-sel':''} ${isLow?'is-low':''}">
      <td><div style="font-weight:600">${esc(quoteName(q))}</div>${q.note?`<div class="muted" style="font-size:11px">${esc(q.note)}</div>`:""}</td>
      <td class="num cell-strong">${Number(q.amount)>0?fmt(q.amount):'—'}</td>
      ${hasDelivery?`<td class="num">${Number(q.deliveryDays)>0?q.deliveryDays+"d":'<span class="muted">—</span>'}</td>`:""}
      <td>${q.selected?'<span class="badge b-green"><span class="dot"></span>Selected</span>':''}
          ${isBest?'<span class="badge b-blue"><span class="dot"></span>★ Recommended</span>':(isLow&&!q.selected?'<span class="badge b-slate"><span class="dot"></span>Lowest</span>':'')}</td>
      <td>${q.fileId?`<button class="dl-link" onclick="openFile('${q.fileId}','${jsq(q.fileName||'')}','${esc(q.fileType||'')}')">${eyeIcon()} View</button>`:'<span class="muted" style="font-size:11.5px">no file</span>'}</td>
    </tr>`;
  }).join("");
  return `
    <div class="muted" style="font-size:11.5px;margin-bottom:7px">Selection criteria: <b>${esc(criteriaLabel(r.quoteCriteria))}</b></div>
    <div class="verdict ${vclass}" style="margin-bottom:10px">${vicon}<div>${esc(vd.msg)}</div></div>
    <div class="det-items"><table class="quote-cmp">
      <thead><tr><th>Vendor</th><th style="text-align:right">Quote</th>${hasDelivery?'<th style="text-align:right">Delivery</th>':''}<th></th><th>Document</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${r.quoteJustification?`<div class="cmt" style="margin-top:10px;font-size:12px"><b>Justification:</b> ${esc(r.quoteJustification)}</div>`:""}
  `;
}
function openReq(id){
  const r=DB.requisitions.find(x=>x.id===id); if(!r) return;
  const s=statusOf(r);
  const cur=currentStepIndex(r);

  const stepsHtml=r.chain.map((st,i)=>{
    let cls=""; let ic="";
    if(st.status==="approved"){cls="done";ic=checkIcon(13);}
    else if(st.status==="rejected"){cls="rej";ic=xIcon(13);}
    else if(st.status==="hold"){cls="cur";ic="⏸";}
    else if(i===cur&&!isRejected(r)){cls="cur";ic=String(i+1);}
    else ic=String(i+1);
    const canSign=canSignStep(r,st);
    const blocked=(i>cur && cur>=0) || isRejected(r);
    return `<div class="step ${cls}">
      <div class="ic">${ic}</div>
      <div class="body">
        <div class="t">${esc(st.label)}</div>
        <div class="s">${esc(st.sublabel)}</div>
        ${st.status==="approved"?`<div class="meta">✓ Signed by <b>${esc(st.approverName)}</b> · ${dtime(st.decidedAt)} ${st.signMode==="physical"?'<span class="badge b-slate" style="font-size:10px;margin-left:4px">✍️ physical</span>':'<span class="badge b-slate" style="font-size:10px;margin-left:4px">⚡ electronic</span>'}</div>`:""}
        ${st.status==="rejected"?`<div class="meta" style="color:var(--red)">✕ Rejected by <b>${esc(st.approverName)}</b> · ${dtime(st.decidedAt)}</div>`:""}
        ${st.status==="hold"?`<div class="meta" style="color:var(--amber)">⏸ On hold by <b>${esc(st.approverName)}</b> · ${dtime(st.decidedAt)}</div>`:""}
        ${st.comment?`<div class="cmt">${esc(st.comment)}</div>`:""}
        ${(st.status==="pending"||st.status==="hold")&&!blocked?`<div class="act">
          ${canSign?`<button class="btn success sm" onclick="signStep('${r.id}','${st.key}')">${checkIcon(14)} Approve & sign</button>
            <button class="btn danger sm" onclick="rejectStep('${r.id}','${st.key}')">Reject</button>
            ${st.status==="pending"?`<button class="btn sm" onclick="holdStep('${r.id}','${st.key}')" title="Keep pending with a reason">⏸ Hold</button>`:""}`:""}
          ${st.status==="hold"&&canReopenStep(r,st)?`<button class="btn sm" onclick="reopenStep('${r.id}','${st.key}')">Resume (clear hold)</button>`:""}
          ${canFinance()?`<button class="btn sm" onclick="sendApprovalLink('${r.id}','${st.key}')">${linkIcon()} Send approval link</button>`:""}
          ${canFinance()&&(CFG.SIGNATURE||{}).allowPhysical!==false?`<button class="btn sm" onclick="signPhysically('${r.id}','${st.key}')" title="Approver signed the printed form by hand">✍️ Physical signature</button>`:""}
          ${!canSign&&!canFinance()?`<span class="muted" style="font-size:12px">Waiting on ${esc(st.approverName||st.sublabel)}</span>`:""}
        </div>`:""}
        ${st.status==="rejected"&&canReopenStep(r,st)?`<div class="act"><button class="btn sm" onclick="reopenStep('${r.id}','${st.key}')">↩ Reopen — allow re-decision</button></div>`:""}
        ${st.status==="pending"&&blocked?`<div class="meta muted">Pending — earlier steps first</div>`:""}
      </div>
    </div>`;
  }).join("");

  const overdue = !r.completedAt && r.targetDays && (daysBetween(r.createdAt,Date.now())>r.targetDays) && s.group!=="done";

  modal(`
    <div class="modal-head">
      <div>
        <h3 class="mono" style="font-size:16px">${esc(r.number)}</h3>
        <div class="sub">${esc(r.department)}${r.project?" · "+esc(r.project):""}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost icon-btn" onclick="printReq('${r.id}')" title="Print">${printIcon()}</button>
        ${canCreate()?`<button class="btn ghost icon-btn" onclick="duplicateReq('${r.id}')" title="Duplicate this requisition">⧉</button>`:""}
        ${(canCreate()||(r.type==="reimbursable"&&ME&&ME.name===r.preparedBy))&&!fullyApproved(r)?`<button class="btn ghost icon-btn" onclick="closeModal();openReqForm('${r.id}')" title="Edit">${editIcon()}</button>`:""}
        ${canFinance()?`<button class="btn ghost icon-btn" onclick="deleteReq('${r.id}')" title="Delete" style="color:var(--red)">${xCircleIcon()}</button>`:""}
        <button class="btn ghost icon-btn" onclick="closeModal()">${xIcon()}</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="status-bar" style="margin-bottom:18px">
        <span class="badge ${s.cls}" style="font-size:12px;padding:5px 12px"><span class="dot"></span>${esc(s.label)}</span>
        <span class="muted" style="font-size:12px">${approvedCount(r)}/${r.chain.length} signed</span>
        ${overdue?`<span class="badge b-red"><span class="dot"></span>Overdue (${ago(r.createdAt)} / ${r.targetDays}d)</span>`:`<span class="muted" style="font-size:12px">${r.completedAt?`Completed in ${daysBetween(r.createdAt,r.completedAt)} days`:`Open ${ago(r.createdAt)}`}</span>`}
      </div>

      <div class="detail-grid">
        <div>
          <div class="kv">
            <div class="row"><div class="k">Type</div><div class="v">${r.type==="reimbursable"?'<span class="badge b-blue"><span class="dot"></span>Reimbursable expense</span>':r.type==="credit"?'<span class="badge b-amber"><span class="dot"></span>Credit service request</span>':'Purchase requisition'}</div></div>
            ${r.convertedFromId?(()=>{const src=DB.requisitions.find(x=>x.id===r.convertedFromId);return `<div class="row"><div class="k">Converted from</div><div class="v"><button class="dl-link" onclick="openReq('${r.convertedFromId}')">${src?esc(src.number):'credit request'} ›</button></div></div>`;})():""}
            ${r.mergedFromIds&&r.mergedFromIds.length?`<div class="row"><div class="k">Combines</div><div class="v">${r.mergedFromIds.map(id=>{const src=DB.requisitions.find(x=>x.id===id);return `<button class="dl-link" onclick="openReq('${id}')">${src?esc(src.number):'?'} ›</button>`;}).join(" ")}</div></div>`:""}
            <div class="row"><div class="k">Purpose</div><div class="v">${esc(r.purpose)}</div></div>
            <div class="row"><div class="k">Date</div><div class="v">${dlong(r.date)}</div></div>

          `:""}

                : `${fullyApproved(r)?`<span class="badge b-amber"><span class="dot"></span>Awaiting from vendor</span>${canFinance()?`<button class="btn ghost sm" onclick="setInvoiceStatus('${r.id}','received')">Mark received</button>`:""}`:`<span class="badge b-slate"><span class="dot"></span>Pending HOD approval</span>`}`}
            </div>
          </div></div>
          ${fullyApproved(r)&&!r.convertedToId&&canFinance()?`<button class="btn primary sm" style="margin-top:10px" onclick="convertCreditToReq('${r.id}')">${plusIcon()} Convert to purchase requisition</button>
            <div class="hint" style="margin-top:6px">Once the vendor's bill is in, convert this into a full requisition for the normal approval &amp; payment flow.</div>`:""}
          `:""}

          <div class="section-title" style="margin-top:24px">${docTitle(r)}</div>
          ${(r.receipts&&r.receipts.length)?`<div class="det-items"><table>

            <tbody>${r.receipts.map(rc=>`<tr>
              <td><button class="dl-link" onclick="openFile('${rc.fileId}','${jsq(rc.fileName||'')}','${esc(rc.fileType||'')}')">${fileIconSm()} ${esc(rc.fileName)}</button></td>
              <td class="muted" style="font-size:11.5px">${esc(rc.addedBy||"")} · ${dshort(rc.addedAt)}</td>
              <td style="text-align:right">${canFinance()?`<button class="btn ghost sm" onclick="rmReceipt('${r.id}','${rc.id}')">${xIcon(12)}</button>`:""}</td>
            </tr>`).join("")}</tbody>
          </table></div>`:`<div class="verdict none">${infoIcon()}<div>${r.type==="reimbursable"?(fullyApproved(r)?"Attach the invoices/receipts so finance can reimburse.":"Receipts are attached after the HOD approves and the expense is incurred."):r.type==="credit"?(fullyApproved(r)?"Attach the vendor's bill/invoice when it arrives.":"The bill is attached after the HOD approves and the service is carried out."):"Attach invoices and supporting documents here for the audit file."}</div></div>`}
          ${(canFinance()||(ME&&ME.name===r.preparedBy))?`<label class="btn-file" style="margin-top:10px;display:inline-flex">${uploadIcon()} Attach ${r.type==="credit"?"bill / invoice":r.type==="reimbursable"?"receipt":"document"}<input type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp" style="display:none" onchange="addReceiptFiles('${r.id}',this)"></label>`:""}
        </div>

        <div>
          <div class="section-title" style="margin-top:0">Approval chain</div>
          <div class="chain">${stepsHtml}</div>

          <div class="section-title">Finalisation</div>
          <div class="lifecycle">
            <div class="lc-row">
              <div class="lc-l">${walletIconSm()} ${r.type==="reimbursable"?"Reimbursement":"Payment"}</div>
              <div style="display:flex;gap:8px;align-items:center">
                ${r.paymentStatus==="paid"
                  ? `<span class="badge b-green"><span class="dot"></span>${r.type==="reimbursable"?"Reimbursed":"Paid"} · ${dshort(r.paidDate)}</span>${canFinance()?`<button class="btn ghost sm" onclick="togglePaid('${r.id}')">Undo</button>`:""}`
                  : `${fullyApproved(r)&&canFinance()?`<button class="btn success sm" onclick="markPaid('${r.id}')">${r.type==="reimbursable"?"Mark reimbursed":"Mark paid"}</button>`:`<span class="badge b-slate"><span class="dot"></span>${r.type==="reimbursable"?"Not reimbursed":"Unpaid"}</span>`}`}
              </div>
            </div>
            <div class="lc-row">
              <div class="lc-l">${odooIconSm()} Posted to Odoo</div>
              <div style="display:flex;gap:8px;align-items:center">
                ${r.odooStatus==="posted"
                  ? `<span class="badge b-green"><span class="dot"></span>${esc(r.odooRef||"Posted")}</span>${canFinance()?`<button class="btn ghost sm" onclick="toggleOdoo('${r.id}')">Undo</button>`:""}`
                  : `${r.paymentStatus==="paid"&&canFinance()?`<button class="btn primary sm" onclick="postToOdoo('${r.id}')">${odooIconSm()} Post to Odoo</button><button class="btn ghost sm" onclick="markOdoo('${r.id}')" title="Record a bill you already created in Odoo">Mark manually</button>`:`<span class="badge b-slate"><span class="dot"></span>Not posted</span>`}`}
              </div>
            </div>

          ${r.type==="purchase"&&fullyApproved(r)?`
          <div class="section-title">Goods received</div>
          ${r.grn?`<div class="lifecycle"><div class="lc-row"><div class="lc-l">📦 GRN ${r.grn.ref?'<span class="mono">'+esc(r.grn.ref)+'</span>':''}</div><div>${r.grn.complete?'<span class="badge b-green"><span class="dot"></span>All received</span>':'<span class="badge b-amber"><span class="dot"></span>Partial / issues</span>'}</div></div>
            <div class="hint" style="margin-top:6px">Received by ${esc(r.grn.receivedBy)} · ${dshort(r.grn.receivedAt)}${r.grn.note?' · '+esc(r.grn.note):''}</div>
            <div class="det-items" style="margin-top:8px"><table><thead><tr><th>Item</th><th class="num">Ordered</th><th class="num">Received</th><th>Condition</th></tr></thead><tbody>${(r.grn.items||[]).map(g=>`<tr><td>${esc(g.item)}</td><td class="num">${g.qtyOrdered}</td><td class="num cell-strong">${g.qtyReceived}</td><td>${g.condition==="good"?'<span class="badge b-green">Good</span>':`<span class="badge b-amber">${esc(g.condition)}</span>`}</td></tr>`).join("")}</tbody></table></div>
            ${canFinance()?`<button class="btn ghost sm" style="margin-top:8px" onclick="recordGrn('${r.id}')">Edit GRN</button>`:""}</div>`
          :`<div class="verdict none">${infoIcon()}<div>Goods not yet recorded as received.${r.paymentStatus!=="paid"?" Record the GRN before paying.":""}</div></div>
            ${(canFinance()||(ME&&ME.name===r.preparedBy))?`<button class="btn sm" style="margin-top:8px" onclick="recordGrn('${r.id}')">📦 Record goods received</button>`:""}`}`:""}

          <div class="section-title">Activity</div>
          <div id="auditList"><div class="muted" style="font-size:12px">Loading…</div></div>
        </div>
      </div>
    </div>
  `,"wide");
  setTimeout(()=>loadAudit(r),60);
}

/* ================= ADMIN TAB ================= */
let adminTab="numbering";
const qsa=(s)=>[...document.querySelectorAll(s)];
function renderAdmin(){
  const host=$("#panel-admin"); if(!host) return;
  if(!isAdmin()){ host.innerHTML=`<div class="empty" style="margin-top:60px">${lockIcon()}<p>Admins only.</p></div>`; return; }
  if(!SETTINGS){ host.innerHTML=`<div class="page-head"><div><h2>Admin</h2></div></div><div class="empty" style="margin-top:40px"><p>System settings are available in live mode only.</p></div>`; return; }
  const S=SETTINGS;
  const tabs=[["numbering","Numbering"],["tax","Tax"],["chain","Approval chain"],["threshold","Low-value rule"],["lists","Categories & lists"],["odoo","Odoo"],["users","Users"]];
  const tabBar=`<div class="admin-tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${adminTab===k?"on":""}" onclick="adminTab='${k}';renderAdmin()">${l}</button>`).join("")}</div>`;
  const card=(title,desc,bodyHtml,footHtml)=>`<div class="acard"><div class="acard-head"><h3>${title}</h3>${desc?`<p>${desc}</p>`:""}</div><div class="acard-body">${bodyHtml}</div>${footHtml?`<div class="acard-foot">${footHtml}</div>`:""}</div>`;
  const opt=`<span class="hint" style="text-transform:none;font-weight:400;letter-spacing:0"> · optional</span>`;
  let body="";
  if(adminTab==="numbering"){
    const Y=new Date().getFullYear(); const seq=k=>(S.sequences&&S.sequences[k])||{year:Y,next:1};
    const pre=S.reqPrefix||"FAM/REQ", pad=n=>String(n).padStart(3,"0");
    body=card("Requisition numbering",
      `Numbers are assigned by the server the moment a requisition is saved, so two people can never receive the same number. Set the next number to continue an existing paper sequence — it never drops below a number already in use.`,
      `<div class="kpi-row">
         <div class="kpi"><div class="k">Next purchase</div><div class="v">${esc(pre)}/${Y}/${pad(seq("purchase").next)}</div></div>
         <div class="kpi"><div class="k">Next expense</div><div class="v">${esc(pre.replace(/REQ$/,"EXP"))}/${Y}/${pad(seq("reimbursable").next)}</div></div>
         <div class="kpi"><div class="k">Next credit request</div><div class="v">${esc(pre.replace(/REQ$/,"CSR"))}/${Y}/${pad(seq("credit").next)}</div></div>
       </div>
       <div class="form-grid cols4">
        <div class="field"><label>Prefix</label><input id="ad_prefix" value="${esc(pre)}"><div class="hint">…/EXP and …/CSR are derived automatically</div></div>
        <div class="field"><label>Next purchase no.</label><input id="ad_seq_p" type="number" min="1" value="${seq("purchase").next}"></div>
        <div class="field"><label>Next expense no.</label><input id="ad_seq_r" type="number" min="1" value="${seq("reimbursable").next}"></div>
        <div class="field"><label>Next credit no.</label><input id="ad_seq_c" type="number" min="1" value="${seq("credit").next}"></div>
       </div>`,
      `<span class="hint">Sequences restart at 001 each January.</span><span class="spacer"></span><button class="btn primary" onclick="adminSaveNumbering()">Save numbering</button>`);
  } else if(adminTab==="tax"){
    const T=Object.assign({gst:8,tgst:17},S.taxRates||{});
    body=card("Tax &amp; quotations",
      `Every requisition selects No tax, GST or TGST. Changed rates apply to requisitions created or edited from now on; saved totals are not recalculated.`,
      `<div class="form-grid cols3">
        <div class="field"><label>GST rate %</label><input id="ad_gst" type="number" step="0.1" min="0" value="${T.gst}"></div>
        <div class="field"><label>TGST rate %</label><input id="ad_tgst" type="number" step="0.1" min="0" value="${T.tgst}"></div>
        <div class="field"><label>Quotations required</label><input id="ad_quotes" type="number" min="0" value="${S.quotesRequired??3}"><div class="hint">Purchase requisitions at or above the low-value limit</div></div>
       </div>`,
      `<span class="spacer"></span><button class="btn primary" onclick="adminSaveTax()">Save tax settings</button>`);
  } else if(adminTab==="chain"){
    const ROLES=[["dept_head","Dept Head"],["general_secretary","Gen. Secretary"],["finance_confirm","Budget / Finance"],["president","President"],["external","External"]];
    const rows=(S.chain||[]).map((c,i)=>`<div class="chain-row ${c.enabled===false?"off":""}">
        <span class="n">${i+1}</span>
        <input class="input sm" value="${esc(c.label)}" placeholder="Label on form" onchange="SETTINGS.chain[${i}].label=this.value">
        <input class="input sm" value="${esc(c.sublabel)}" placeholder="Signer / title" onchange="SETTINGS.chain[${i}].sublabel=this.value">
        <select class="input sm" onchange="SETTINGS.chain[${i}].approverRole=this.value">${ROLES.map(([k,l])=>`<option value="${k}" ${c.approverRole===k?"selected":""}>${l}</option>`).join("")}</select>
        <label class="switch" title="${c.enabled===false?"Skipped":"Enabled"}"><input type="checkbox" ${c.enabled!==false?"checked":""} onchange="SETTINGS.chain[${i}].enabled=this.checked;renderAdmin()"><i></i></label>
        <div class="acts"><button class="btn ghost sm" onclick="adminMoveStep(${i},-1)" ${i===0?"disabled":""} title="Move up">↑</button><button class="btn ghost sm" onclick="adminMoveStep(${i},1)" ${i===(S.chain.length-1)?"disabled":""} title="Move down">↓</button><button class="btn ghost sm" style="color:var(--red)" onclick="adminRemoveStep(${i})" title="Remove step">${xIcon(12)}</button></div>
      </div>`).join("");
    body=card("Approval chain",
      `Top to bottom is the signing order for purchase requisitions. Switch a step off to skip it, or remove it entirely (for example the external approver). Applies to new requisitions; existing ones keep the chain they were created with.`,
      `<div class="chain-row head"><span></span><span>Label on form</span><span>Signer</span><span>Who can sign</span><span>Active</span><span></span></div>${rows||'<div class="muted" style="padding:14px 0">No steps — add one below.</div>'}
       <div style="margin-top:14px"><button class="btn sm" onclick="adminAddStep()">${plusIcon()} Add step</button></div>`,
      `<span class="hint">${(S.chain||[]).filter(c=>c.enabled!==false).length} active step(s)</span><span class="spacer"></span><button class="btn primary" onclick="saveSettings().then(ok=>ok&&renderAdmin())">Save chain</button>`);
  } else if(adminTab==="threshold"){
    const T=Object.assign({enabled:false,amount:5000,quotesRequired:1,steps:[]},S.threshold||{});
    body=card("Low-value rule",
      `Purchase requisitions below the limit need fewer quotations and only the approvers you select. Expenses and credit requests are not affected.`,
      `<label class="chk-chip ${T.enabled?"on":""}" style="margin-bottom:18px"><input type="checkbox" id="ad_th_on" ${T.enabled?"checked":""} onchange="this.parentNode.classList.toggle('on',this.checked)"> Enable the low-value rule</label>
       <div class="form-grid">
        <div class="field"><label>Below amount (${esc(CFG.CURRENCY)}, sub-total)</label><input id="ad_th_amt" type="number" min="0" value="${T.amount}"></div>
        <div class="field"><label>Quotations required below the limit</label><input id="ad_th_q" type="number" min="0" value="${T.quotesRequired}"></div>
       </div>
       <div class="field" style="margin-top:18px"><label>Approvers still required</label>
        <div class="chips" style="margin-top:4px">${(S.chain||[]).filter(c=>c.enabled!==false).map(c=>`<label class="chk-chip ${T.steps.includes(c.key)?"on":""}"><input type="checkbox" class="ad_th_step" value="${esc(c.key)}" ${T.steps.includes(c.key)?"checked":""} onchange="this.parentNode.classList.toggle('on',this.checked)"> ${esc(c.sublabel)}</label>`).join("")||'<span class="muted">Enable chain steps first.</span>'}</div>
       </div>`,
      `<span class="spacer"></span><button class="btn primary" onclick="adminSaveThreshold()">Save rule</button>`);
  } else if(adminTab==="lists"){
    const ed=(title,key,hint,hasDefault,singular)=>{
      const list=S[key]||[];
      const chips=list.map((v,i)=>`<span class="chip ${hasDefault&&i===0?"def":""}">${esc(v)}${hasDefault&&i===0?'<span class="tag">default</span>':""}${hasDefault&&i!==0?`<button class="star" title="Make default" onclick="adminListDefault('${key}',${i})">★</button>`:""}<button title="Remove" onclick="adminListRemove('${key}',${i})">×</button></span>`).join("");
      return card(title,hint,
        `<div class="chips">${chips||'<span class="muted">Nothing yet.</span>'}</div>
         <form class="chip-add" onsubmit="event.preventDefault();adminListAdd('${key}')"><input class="input sm" id="ad_add_${key}" placeholder="Add ${singular||"entry"}…" autocomplete="off"><button class="btn sm" type="submit">${plusIcon()} Add</button></form>`,
        `<span class="hint">${list.length} entr${list.length===1?"y":"ies"} · changes save immediately</span>`);
    };
    body=ed("Vendor categories","vendorCategories","Offered when registering a vendor.",false,"a category")
        +ed("Currencies","currencies","The default currency is pre-selected on new requisitions. Use the star to change it.",true,"a currency code, e.g. EUR")
        +ed("Departments","departments","Requesting departments shown on the requisition form.",false,"a department");
  } else if(adminTab==="odoo"){
    const O=S.odoo||{};
    body=card("Odoo connection",
      `“Post to Odoo” on a paid requisition creates a vendor bill in Odoo — the vendor is found or created, line items and tax are carried over. The API key lives only on the server as <span class="mono">ODOO_API_KEY</span>; it is never stored here.`,
      `<div class="form-grid">
        <div class="field full"><label>Odoo URL</label><input id="ad_od_url" value="${esc(O.url||"")}" placeholder="https://yourcompany.odoo.com"></div>
        <div class="field"><label>Database</label><input id="ad_od_db" value="${esc(O.db||"")}"></div>
        <div class="field"><label>Username (login email)</label><input id="ad_od_user" value="${esc(O.username||"")}" placeholder="accounts@fam.mv"></div>
       </div>
       <div class="form-grid cols3" style="margin-top:15px">
        <div class="field"><label>Tax ID for GST${opt}</label><input id="ad_od_tgst0" type="number" value="${O.taxIdGst??""}" placeholder="account.tax id"></div>
        <div class="field"><label>Tax ID for TGST${opt}</label><input id="ad_od_tgst1" type="number" value="${O.taxIdTgst??""}" placeholder="account.tax id"></div>
        <div class="field"><label>Purchase journal ID${opt}</label><input id="ad_od_j" type="number" value="${O.journalId??""}" placeholder="account.journal id"></div>
       </div>
       <div class="hint" style="margin-top:10px">Leave the tax IDs blank and the tax is added as its own bill line so the total still matches.</div>`,
      `<button class="btn" onclick="testOdoo()">Test connection</button><span id="odooTestOut"></span><span class="spacer"></span><button class="btn primary" onclick="adminSaveOdoo()">Save connection</button>`);
  } else if(adminTab==="users"){ body=`<div id="adminUsersHost"></div>`; }
  host.innerHTML=`<div class="admin-wrap"><div class="page-head"><div><h2>Admin</h2><div class="sub">System settings — changes apply to new requisitions</div></div></div>${tabBar}${body}</div>`;
  if(adminTab==="users") renderUsers("#adminUsersHost");
}
function adminListAdd(key){ const inp=$("#ad_add_"+key); const v=(inp.value||"").trim(); if(!v) return; SETTINGS[key]=SETTINGS[key]||[]; if(SETTINGS[key].some(x=>x.toLowerCase()===v.toLowerCase())){ toast("Already in the list",1); return; } SETTINGS[key].push(key==="currencies"?v.toUpperCase():v); saveSettings().then(ok=>ok&&renderAdmin()); }
function adminListRemove(key,i){ const list=SETTINGS[key]||[]; if(list.length<=1){ toast("Keep at least one entry",1); return; } const v=list[i]; confirmModal("Remove entry?",`Remove “${v}”? Existing records that use it are not changed.`,()=>{ closeModal(); list.splice(i,1); saveSettings().then(ok=>ok&&renderAdmin()); }); }
function adminListDefault(key,i){ const list=SETTINGS[key]||[]; const [v]=list.splice(i,1); list.unshift(v); saveSettings().then(ok=>ok&&renderAdmin()); }
function adminSaveNumbering(){ const S=SETTINGS,Y=new Date().getFullYear(); S.reqPrefix=$("#ad_prefix").value.trim()||"FAM/REQ"; S.sequences=S.sequences||{}; [["purchase","#ad_seq_p"],["reimbursable","#ad_seq_r"],["credit","#ad_seq_c"]].forEach(([k,id])=>{ S.sequences[k]={year:Y,next:Math.max(1,parseInt($(id).value,10)||1)}; }); saveSettings().then(ok=>ok&&renderAdmin()); }
function adminSaveTax(){ const S=SETTINGS; S.taxRates={gst:parseFloat($("#ad_gst").value)||0,tgst:parseFloat($("#ad_tgst").value)||0}; S.quotesRequired=Math.max(0,parseInt($("#ad_quotes").value,10)||0); saveSettings().then(ok=>ok&&renderAdmin()); }
function adminMoveStep(i,d){ const c=SETTINGS.chain,j=i+d; if(j<0||j>=c.length) return; [c[i],c[j]]=[c[j],c[i]]; renderAdmin(); }
function adminRemoveStep(i){ const c=SETTINGS.chain[i]; confirmModal("Remove step?",`Remove “${c.sublabel}” from the approval chain? Existing requisitions keep their chains; new ones won't include it.`,()=>{ closeModal(); SETTINGS.chain.splice(i,1); saveSettings().then(ok=>ok&&renderAdmin()); }); }
function adminAddStep(){ SETTINGS.chain=SETTINGS.chain||[]; SETTINGS.chain.push({key:"step_"+Math.random().toString(36).slice(2,7),label:"Approved By",sublabel:"New approver",approverRole:"dept_head",enabled:true}); renderAdmin(); }
function adminSaveThreshold(){ const S=SETTINGS; S.threshold={enabled:$("#ad_th_on").checked,amount:parseFloat($("#ad_th_amt").value)||0,quotesRequired:Math.max(0,parseInt($("#ad_th_q").value,10)||0),steps:qsa(".ad_th_step").filter(x=>x.checked).map(x=>x.value)}; saveSettings().then(ok=>ok&&renderAdmin()); }
function adminSaveList(key){ const lines=$("#ad_list_"+key).value.split("\n").map(s=>s.trim()).filter(Boolean); if(!lines.length){ toast("Add at least one entry",1); return; } SETTINGS[key]=[...new Set(lines)]; saveSettings().then(ok=>ok&&renderAdmin()); }
function adminSaveOdoo(){ const S=SETTINGS,n=id=>{ const v=$(id).value.trim(); return v===""?null:Number(v); }; S.odoo={url:$("#ad_od_url").value.trim().replace(/\/+$/,""),db:$("#ad_od_db").value.trim(),username:$("#ad_od_user").value.trim(),taxIdGst:n("#ad_od_tgst0"),taxIdTgst:n("#ad_od_tgst1"),journalId:n("#ad_od_j")}; saveSettings().then(ok=>ok&&renderAdmin()); }

  const out=$("#odooTestOut"); if(!window.__pb){ toast("Live mode only",1); return; } if(out) out.textContent="Testing…";

/* ================= PHYSICAL SIGNATURE ================= */
function signPhysically(reqId,stepKey){
  const r=DB.requisitions.find(x=>x.id===reqId); const st=r&&r.chain.find(s=>s.key===stepKey); if(!st) return;
  const defName=(DB.users.find(u=>(u.approverRoles||[]).includes(st.approverRole))||{}).name||"";
  modal(`<div class="modal-head"><div><h3>Physical signature — ${esc(st.sublabel)}</h3><div class="sub">${esc(r.number)}</div></div><button class="btn ghost icon-btn" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:12px">Use this when the approver signed the <b>printed</b> form by hand. Record who signed and when, and attach a scan of the signed page for the audit file.</div>
      <div class="form-grid">
        <div class="field"><label>Signed by <span class="req">*</span></label><input id="ps_name" value="${esc(defName)}"></div>
        <div class="field"><label>Date signed</label><input id="ps_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field full"><label>Scan of signed page <span class="hint" style="text-transform:none;font-weight:400">(recommended)</span></label><input id="ps_file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"></div>
        <div class="field full"><label>Note</label><input id="ps_note" placeholder="optional"></div>
      </div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn success" id="ps_go">${checkIcon(14)} Record physical signature</button></div>`);
  $("#ps_go").onclick=async()=>{
    const name=$("#ps_name").value.trim(); if(!name){ toast("Enter who signed",1); return; }
    const f=$("#ps_file").files[0];
    if(f){ const fileId=uid("f"); try{ await FileStore.put(fileId,f); }catch(e){} r.receipts=r.receipts||[]; r.receipts.push({id:uid("rc"),fileId,fileName:"Signed — "+st.sublabel+" — "+f.name,fileType:f.type,addedBy:ME.name,addedAt:new Date().toISOString(),kind:"signature",stepKey}); }
    st.status="approved"; st.approverName=name; st.decidedAt=new Date(($("#ps_date").value||new Date().toISOString().slice(0,10))+"T12:00:00").toISOString(); st.signMode="physical";
    const note=$("#ps_note").value.trim(); if(note) st.comment=note;
    maybeComplete(r); persist(); closeModal(); toast("Physical signature recorded"); refreshAll(); openReq(reqId);
  };
}

/* ================= GOODS RECEIVED NOTE ================= */
function recordGrn(reqId){
  const r=DB.requisitions.find(x=>x.id===reqId); if(!r) return; const g=r.grn||{};
  const rows=(r.items||[]).map((it,i)=>{ const p=(g.items||[])[i]||{}; return `<tr><td>${esc(it.item)}</td><td class="num">${it.qty}</td><td><input type="number" class="grn_q" data-i="${i}" min="0" value="${p.qtyReceived??it.qty}" style="width:90px"></td><td><select class="grn_c" data-i="${i}">${["good","partial","damaged","missing"].map(c=>`<option value="${c}" ${(p.condition||"good")===c?"selected":""}>${c[0].toUpperCase()+c.slice(1)}</option>`).join("")}</select></td></tr>`; }).join("");
  modal(`<div class="modal-head"><div><h3>Goods Received Note</h3><div class="sub">${esc(r.number)}${reqPayeeName(r)?" · "+esc(reqPayeeName(r)):""}</div></div><button class="btn ghost icon-btn" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body">
      <div class="form-grid"><div class="field"><label>Received by <span class="req">*</span></label><input id="grn_by" value="${esc(g.receivedBy||ME.name)}"></div>
        <div class="field"><label>Date received</label><input id="grn_at" type="date" value="${esc((g.receivedAt||new Date().toISOString()).slice(0,10))}"></div>
        <div class="field full"><label>Delivery note / GRN reference</label><input id="grn_ref" value="${esc(g.ref||"")}" placeholder="e.g. DN-4471"></div></div>
      <div class="section-title">Items received</div>
      <div class="det-items"><table><thead><tr><th>Item</th><th class="num">Ordered</th><th>Received</th><th>Condition</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="field full" style="margin-top:12px"><label>Notes</label><textarea id="grn_note">${esc(g.note||"")}</textarea></div>
      <div class="field full"><label>Attach delivery note <span class="hint" style="text-transform:none;font-weight:400">(optional)</span></label><input id="grn_file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn success" id="grn_go">${checkIcon(14)} Save GRN</button></div>`);
  $("#grn_go").onclick=async()=>{
    const by=$("#grn_by").value.trim(); if(!by){ toast("Enter who received the goods",1); return; }
    const qs=qsa(".grn_q"), cs=qsa(".grn_c");
    const items=(r.items||[]).map((it,i)=>({ item:it.item, qtyOrdered:Number(it.qty)||0, qtyReceived:Number((qs.find(x=>+x.dataset.i===i)||{}).value)||0, condition:((cs.find(x=>+x.dataset.i===i)||{}).value)||"good" }));
    const f=$("#grn_file").files[0];
    if(f){ const fileId=uid("f"); try{ await FileStore.put(fileId,f); }catch(e){} r.receipts=r.receipts||[]; r.receipts.push({id:uid("rc"),fileId,fileName:"GRN — "+f.name,fileType:f.type,addedBy:ME.name,addedAt:new Date().toISOString(),kind:"grn"}); }
    r.grn={ receivedBy:by, receivedAt:new Date(($("#grn_at").value||new Date().toISOString().slice(0,10))+"T12:00:00").toISOString(), ref:$("#grn_ref").value.trim(), items, note:$("#grn_note").value.trim(),
      complete:items.every(x=>x.qtyReceived>=x.qtyOrdered&&x.condition==="good"), recordedBy:ME.name, recordedAt:new Date().toISOString() };
    persist(); closeModal(); toast("Goods received note saved"); refreshAll(); openReq(reqId);
  };
}

/* ================= AUDIT TIMELINE ================= */
async function loadAudit(r){
  const host=$("#auditList"); if(!host) return;
  if(!window.__pb){ host.innerHTML=`<div class="muted" style="font-size:12px">Activity is recorded in live mode.</div>`; return; }
  try{
    const rows=await window.__pb.collection("req_audit").getFullList({ filter:`reqXid="${String(r.id).replace(/["\\]/g,"")}"`, sort:"-created", batch:200 });
    if(!rows.length){ host.innerHTML=`<div class="muted" style="font-size:12px">No activity recorded yet.</div>`; return; }
    const LBL={created:"Created",edited:"Edited","payment.paid":"Marked paid","payment.changed":"Payment updated","odoo.posted":"Posted to Odoo","odoo.unposted":"Odoo posting undone","grn.recorded":"Goods received recorded",renumbered:"Renumbered"};
    host.innerHTML=rows.map(a=>{
      let t=LBL[a.action]||a.action;
      if(String(a.action).startsWith("step.")){ const p=a.action.split("."); const d=(a.detail&&a.detail.chain&&a.detail.chain[0])||a.detail||{}; t=`Step “${esc(d.label||d.step||"")}” → ${esc(p[1])}${p[2]==="physical"?" ✍️ physical":p[2]==="link"?" ⚡ via link":""}`; }
      return `<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px"><div style="color:var(--ink-3);white-space:nowrap;min-width:112px">${dtime(a.at||a.created)}</div><div><b>${t}</b><span class="muted"> · ${esc(a.actorName||"system")}</span></div></div>`;
    }).join("");
  }catch(e){ host.innerHTML=`<div class="muted" style="font-size:12px">Activity unavailable.</div>`; }
}

/* ================= CSV EXPORT / DUPLICATE / ODOO POST ================= */
function exportCsv(){
  const rep=buildReport(); if(!rep||!rep.rows||!rep.rows.length){ toast("Nothing to export for this filter",1); return; }
  const cell=v=>{ const s=String(v??"").replace(/<[^>]+>/g,""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv="\ufeff"+[rep.cols||[]].concat(rep.rows).map(row=>row.map(cell).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`FAM-${String(rep.title||"report").replace(/\s+/g,"-")}-${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
}
function duplicateReq(id){
  const src=DB.requisitions.find(x=>x.id===id); if(!src) return; const today=new Date().toISOString().slice(0,10);
  const copy=makeReq({ number:nextReqNumber(src.type), date:today, type:src.type, currency:src.currency, budgetLine:src.budgetLine, quoteCriteria:src.quoteCriteria, taxType:taxTypeOf(src),
    department:src.department, project:src.project, purpose:src.purpose, payee:src.payee, payeeVendorId:src.payeeVendorId, preparedBy:ME.name, preparedDate:today,
    items:(src.items||[]).map(i=>({...i})), quotes:[], receipts:[], targetDays:src.targetDays, createdAt:new Date().toISOString() });
  if(src.type==="credit") copy.invoiceStatus="awaiting";
  DB.requisitions.unshift(copy); persist(); closeModal(); refreshAll(); toast("Duplicated as "+copy.number+" — review and save"); openReqForm(copy.id);
}
function postToOdoo(reqId){
  const r=DB.requisitions.find(x=>x.id===reqId); if(!r) return;
  if(!window.__pb){ toast("Odoo posting works in live mode",1); return; }
  confirmModal("Post to Odoo?",`Create a vendor bill in Odoo for ${r.number} — ${rmoney(r,r.total)} to ${reqPayeeName(r)||"the payee"}.`,async()=>{
    closeModal(); toast("Posting to Odoo…");
    try{
      const res=await fetch(window.PB_URL+"/api/fam/odoo-post",{method:"POST",headers:{"Content-Type":"application/json",Authorization:window.__pb.authStore.token},body:JSON.stringify({reqXid:r.id})});
      const j=await res.json();
      if(!res.ok){ toast(j.message||j.error||"Odoo posting failed",1); return; }
      r.odooStatus="posted"; r.odooRef=j.odooRef||"Posted"; maybeComplete(r);
      toast("Posted to Odoo: "+r.odooRef); refreshAll(); openReq(reqId);
    }catch(e){ toast("Odoo posting failed — check the connection in Admin → Odoo",1); }
  });
}

/* ---------------- approval actions ---------------- */
function signStep(reqId,stepKey,byName){
  const r=DB.requisitions.find(x=>x.id===reqId); const st=r.chain.find(s=>s.key===stepKey);
  if(!st) return;
  st.status="approved";
  st.approverName=byName || (ME?ME.name:"Approver");
  st.decidedAt=new Date().toISOString();
  maybeComplete(r); persist();
  toast(`Signed: ${st.sublabel}`);
  refreshAll();
  if($("#overlay").classList.contains("open")) openReq(reqId);
}
function rejectStep(reqId,stepKey){
  const r=DB.requisitions.find(x=>x.id===reqId); const st=r.chain.find(s=>s.key===stepKey);
  promptModal("Reject requisition","Add a reason (the requester will see this).","e.g. Need a second quotation first",(reason)=>{
    if(reason===null) return;
    st.status="rejected"; st.approverName=ME?ME.name:"Approver"; st.decidedAt=new Date().toISOString(); st.comment=reason;
    persist(); toast("Requisition rejected",1); refreshAll(); openReq(reqId);
  });
}
function holdStep(reqId,stepKey){
  const r=DB.requisitions.find(x=>x.id===reqId); const st=r.chain.find(s=>s.key===stepKey);
  promptModal("Put on hold","Why isn't this being approved yet? (the requester will see this)","e.g. Waiting for budget review before signing",(reason)=>{
    if(reason===null) return;
    if(!reason){ toast("A reason is required to put a requisition on hold",1); return; }
    st.status="hold"; st.approverName=ME?ME.name:"Approver"; st.decidedAt=new Date().toISOString(); st.comment=reason;
    persist(); toast("Put on hold"); refreshAll(); openReq(reqId);
  });
}
async function reopenStep(reqId,stepKey){
  const r=DB.requisitions.find(x=>x.id===reqId); const st=r.chain.find(s=>s.key===stepKey);
  confirmModal("Reopen this step?","The "+(st.status==="rejected"?"rejection":"hold")+" is cleared and the step goes back to pending, so it can be decided again. The previous comment stays on record.",async ()=>{
    if(window.__reopenApproval){ try{ await window.__reopenApproval(r,st); }catch(e){} } // reset the magic-link record first (live mode)
    st.status="pending"; st.approverName=""; st.decidedAt=null;
    maybeComplete(r); persist(); closeModal(); toast("Step reopened"); refreshAll(); openReq(reqId);
  });
}
function deleteReq(reqId){
  const r=DB.requisitions.find(x=>x.id===reqId); if(!r) return;
  confirmModal("Delete "+r.number+"?","This permanently removes the requisition, its quotations and any approval links that were sent. This cannot be undone.",()=>{
    DB.requisitions=DB.requisitions.filter(x=>x.id!==reqId);
    persist(); closeModal(); toast("Requisition deleted"); refreshAll();
  });
}
/* ----- receipts (reimbursable expense requests) ----- */
async function addReceiptFiles(reqId, input){
  if(!DB.requisitions.some(x=>x.id===reqId)) return;
  for(const f of [...(input.files||[])]){
    if(f.size>8*1024*1024){ toast(`${f.name}: too large (max 8 MB)`,1); continue; }
    const fileId="file_"+uid("f");
    try{ await FileStore.put(fileId,f); }catch(e){}
    // re-find after each await — a live-mode reload may have swapped the object
    const r=DB.requisitions.find(x=>x.id===reqId); if(!r) return;
    r.receipts=r.receipts||[];
    r.receipts.push({id:uid("rc"), fileId, fileName:f.name, fileSize:f.size, fileType:f.type, addedBy:ME?ME.name:"", addedAt:new Date().toISOString()});
    if(r.type==="credit") r.invoiceStatus="received"; // a bill arrived
  }
  persist(); openReq(reqId); toast("Document attached");
}
function rmReceipt(reqId, rid){
  const r=DB.requisitions.find(x=>x.id===reqId); if(!r) return;
  const rc=(r.receipts||[]).find(x=>x.id===rid);
  confirmModal("Remove document?",rc?rc.fileName:"", ()=>{
    r.receipts=r.receipts.filter(x=>x.id!==rid);
    persist(); closeModal(); openReq(reqId);
  });
}

/* ----- combine several reimbursements from one staff into one requisition ----- */
function openCombineReimbursements(){
  // group eligible reimbursables (not paid, not already merged) by preparer
  const elig=DB.requisitions.filter(r=>r.type==="reimbursable" && r.paymentStatus!=="paid" && !r.mergedIntoId && !r.convertedToId);
  const byStaff={};
  elig.forEach(r=>{ (byStaff[r.preparedBy]=byStaff[r.preparedBy]||[]).push(r); });
  const staff=Object.keys(byStaff).filter(k=>byStaff[k].length>=2).sort();
  if(!staff.length){ toast("Need at least two unpaid expense requests from the same person to combine",1); return; }
  combineState={ staff:staff[0], picked:{} };
  renderCombineModal(byStaff, staff);
}
let combineState={staff:"",picked:{}};
function renderCombineModal(byStaff, staff){
  const list=byStaff[combineState.staff]||[];
  modal(`
    <div class="modal-head"><div><h3>Combine expense requests</h3><div class="sub">Roll several of one person's reimbursements into a single requisition to pay together</div></div>
      <button class="btn ghost icon-btn" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body">
      <div class="field" style="max-width:320px"><label>Staff member</label>
        <select onchange="combineState.staff=this.value;combineState.picked={};renderCombineModal(window.__byStaff,window.__staff)">
          ${staff.map(nm=>`<option ${combineState.staff===nm?'selected':''}>${esc(nm)} (${byStaff[nm].length})</option>`).join("")}
        </select></div>
      <div class="det-items" style="margin-top:12px"><table>
        <thead><tr><th></th><th>Number</th><th>Purpose</th><th>Status</th><th class="num">Total</th></tr></thead>
        <tbody>${list.map(r=>`<tr>
          <td><input type="checkbox" ${combineState.picked[r.id]?'checked':''} onchange="combineState.picked['${r.id}']=this.checked;refreshCombineFoot()"></td>
          <td><span class="req-no">${esc(r.number)}</span></td>
          <td class="trunc">${esc(r.purpose)}</td>
          <td>${esc(statusOf(r).label)}</td>
          <td class="num cell-strong"><small style="color:var(--ink-3)">${esc(rcur(r))}</small> ${fmt(r.total)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
      <div id="combineFoot" class="hint" style="margin-top:10px"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="combineBtn" onclick="doCombine()">Combine selected</button></div>
  `,"");
  window.__byStaff=byStaff; window.__staff=staff;
  refreshCombineFoot();
}
function refreshCombineFoot(){
  const ids=Object.keys(combineState.picked).filter(id=>combineState.picked[id]);
  const rows=ids.map(id=>DB.requisitions.find(r=>r.id===id)).filter(Boolean);
  const cur={}; rows.forEach(r=>cur[rcur(r)]=(cur[rcur(r)]||0)+r.total);
  const el=$("#combineFoot"); if(el) el.innerHTML = rows.length<2 ? "Select at least two requests." : `${rows.length} selected · combined total ${Object.entries(cur).map(([c,v])=>c+" "+fmt(v)).join(" · ")}`;
  const btn=$("#combineBtn"); if(btn) btn.disabled = rows.length<2;
}
function doCombine(){
  const ids=Object.keys(combineState.picked).filter(id=>combineState.picked[id]);
  const rows=ids.map(id=>DB.requisitions.find(r=>r.id===id)).filter(Boolean);
  if(rows.length<2) return;
  const curs=[...new Set(rows.map(r=>rcur(r)))];
  if(curs.length>1){ toast("All selected requests must be in the same currency",1); return; }
  const staff=combineState.staff;
  const allApproved=rows.every(r=>fullyApproved(r));
  const items=[]; const receipts=[];
  rows.forEach(r=>{
    (r.items||[]).forEach(it=>items.push({item:r.number+": "+it.item, qty:it.qty, rate:it.rate}));
    // Sources may carry different taxes (none / GST / TGST): bring each one's tax
    // across as its own line so the combined total equals the sum of the originals.
    if(Number(r.gstAmount)>0) items.push({item:r.number+": "+taxLabel(r), qty:1, rate:Number(r.gstAmount)});
    (r.receipts||[]).forEach(rc=>receipts.push({...rc}));
  });
  const nr=makeReq({
    number: nextReqNumber("reimbursable"), type:"reimbursable",
    date:new Date().toISOString().slice(0,10), currency:curs[0], taxType:"none",
    department:rows[0].department, project:rows[0].project,
    purpose:"Combined reimbursement for "+staff+" — "+rows.map(r=>r.number.split("/").pop()).join(", "),
    payee:rows[0].payee, payeeVendorId:rows[0].payeeVendorId, preparedBy:staff,
    items, receipts, invoiceStatus:"received",
    mergedFromIds:ids, createdAt:new Date().toISOString()
  });
  // if every source was already HOD-approved, carry that so it's ready to pay
  if(allApproved && nr.chain[0]){ nr.chain[0].status="approved"; nr.chain[0].approverName="Combined from approved requests"; nr.chain[0].decidedAt=new Date().toISOString(); }
  DB.requisitions.unshift(nr);
  rows.forEach(r=>{ r.mergedIntoId=nr.id; });
  persist(); closeModal(); toast("Combined into "+nr.number); openReq(nr.id); refreshAll();
}

/* ---------------- magic link / one-click approval ---------------- */
/* Links are PERSONAL: finance picks which registered user will sign, and the
   decision is recorded as electronically signed by that user. */
function sendApprovalLink(reqId,stepKey){
  const r=DB.requisitions.find(x=>x.id===reqId); const st=r.chain.find(s=>s.key===stepKey);
  if(!r||!st) return;
  const eligible=DB.users.filter(u=>(u.approverRoles||[]).includes(st.approverRole));
  if(!eligible.length){
    toast(`No registered user can sign "${st.sublabel}" — add one in Users first`,1);
    return;
  }
  if(eligible.length===1){ issueApprovalLink(reqId,stepKey,eligible[0].id); return; }
  modal(`
    <div class="modal-head"><div><h3>Who will sign this?</h3><div class="sub">${esc(r.number)} · ${esc(st.sublabel)}</div></div>
      <button class="btn ghost icon-btn" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--ink-2);margin-bottom:12px">The link is personal — the decision will be recorded as electronically signed by the person you pick.</p>

function apDecide(tok,decision){
  const hit=findByToken(tok); if(!hit) return;
  const {r,st}=hit;
  const comment = $("#apComment")?$("#apComment").value.trim():"";
  const signer = (ME&&ME.name) || st.approverName || roleLabel(st.approverRole); // logged-in user, else the person the link was issued to
  if(decision==="approve"){
    st.status="approved"; st.approverName=signer; st.decidedAt=new Date().toISOString(); if(comment) st.comment=comment;
    maybeComplete(r);
  } else if(decision==="hold"){
    if(!comment){ toast("Please add a note explaining why this is on hold",1); return; }
    st.status="hold"; st.approverName=signer; st.decidedAt=new Date().toISOString(); st.comment=comment;
  } else {
    st.status="rejected"; st.approverName=signer; st.decidedAt=new Date().toISOString(); st.comment=comment||"Rejected via approval link";
  }
  persist();
  renderApprovalCard(r,st,true);
  toast(decision==="approve"?"Approved — thank you":decision==="hold"?"Put on hold":"Rejected");
}

  history.pushState({},"",location.pathname);

}

/* resolve viewable src for attached files: local FileStore blob first,
   then the server copy (live mode sets window.__fileUrl) */
async function attachmentSrc(r, fileId, fileType){
  try{ const b=await FileStore.get(fileId); if(b) return URL.createObjectURL(b instanceof Blob?b:new Blob([b],{type:fileType||""})); }catch(e){}
  if(window.__fileUrl){ const u=window.__fileUrl(r, fileId); if(u) return u; }
  return null;
}
async function quoteAttachmentPages(r){
  let pages="", missing=[];
  for(const q of (r.quotes||[])){
    if(!q.fileId) continue;
    const isImg=(q.fileType||"").startsWith("image/");
    if(!isImg){ missing.push(`${quoteName(q)} — ${q.fileName} (PDF, kept on file in the system)`); continue; }
    const src=await attachmentSrc(r, q.fileId, q.fileType);
    if(!src){ missing.push(`${quoteName(q)} — ${q.fileName} (not available on this device)`); continue; }
    pages+=`<div style="page-break-before:always"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#666;font-weight:700;margin-bottom:8px">Quotation — ${esc(quoteName(q))} ${Number(q.amount)>0?`(${esc(rcur(r))} ${fmt(q.amount)})`:""}</div><img src="${src}" style="max-width:100%;border:1px solid #ddd"></div>`;
  }
  return {pages, missing};
}

function saveUser(id){
  const name=$("#u_name").value.trim(); if(!name){toast("Name required",1);return;}
  const data={name,dept:$("#u_dept").value.trim(),role:$("#u_role").value,note:$("#u_note").value.trim(),approverRoles:$$(".u_sign").filter(c=>c.checked).map(c=>c.value)};

function deleteUser(id){
  if(ME && ME.id===id){ toast("You can't delete your own account",1); return; }
  const u=DB.users.find(x=>x.id===id);
  if(u && u.role==="admin" && DB.users.filter(x=>x.role==="admin").length<=1){ toast("Can't delete the last admin — make another user an admin first",1); return; }
  confirmModal("Delete user?","This removes their access. Requisitions they signed keep their name.",()=>{
    DB.users=DB.users.filter(x=>x.id!==id); persist(); closeModal(); renderUsers(); toast("User deleted");
  });

<!-- ============================================================= -->
<!-- SCRIPT #3 · LIVE MODE (PocketBase) — only runs if PB_URL set   -->
<!-- =============================================================
     Real backend so requisitions + approvals work across devices.
     Collections (created by scripts/provision-pb.mjs):
       req_users (auth) · req_vendors · req_requisitions · req_approvals
     The approval page (?approve=<token>) reads/updates req_approvals
     via token-scoped API rules — the approver needs no login.
     pb_hooks/fam.pb.js (optional, recommended) syncs decisions into
     the requisition chain server-side and serves live approval state;
     without it the app reconciles client-side on next load.
------------------------------------------------------------------>
<script type="module">
if (window.PB_URL) {
  const { default: PocketBase } = await import("https://cdn.jsdelivr.net/npm/pocketbase@0.26.9/+esm");
  const pb = new PocketBase(window.PB_URL);
  window.__pb = pb;
  console.info("[FAM Requisition] LIVE mode:", window.PB_URL);

  const COLL = { users:"req_users", vendors:"req_vendors", reqs:"req_requisitions", apps:"req_approvals" };
  const PBID = { users:{}, vendors:{}, requisitions:{} };   // app id (xid) -> PB record id
  const LS   = { users:{}, vendors:{}, requisitions:{} };   // last-synced body per xid
  let APPROVALS = [];                                       // cached req_approvals
  let loaded=false, syncing=false, pendingSync=false, dirtyAgain=false, reloadQueued=false;

  /* ---------- field mapping ---------- */
  const bodyStr = (b)=>JSON.stringify(b);
  const userToRec = (u)=>({ xid:u.id, name:u.name||"", role:u.role||"viewer", dept:u.dept||"", approverRoles:u.approverRoles||[], note:u.note||"" });
  const recToUser = (r)=>({ id:r.xid||r.id, name:r.name||"", role:r.role||"viewer", dept:r.dept||"", approverRoles:r.approverRoles||[], note:r.note||"", username:r.username||"" });
  const VENDOR_KEYS = ["name","category","contact","phone","email","address","regNo","bankName","bankAccount","accountName","status","note"];
  const vendorToRec = (v)=>{ const o={xid:v.id}; VENDOR_KEYS.forEach(k=>o[k]=v[k]??""); o.docs=stripPriv(v.docs||{}); o.fileMap=v.fileMap||{}; return o; };
  const recToVendor = (r)=>{ const o={id:r.xid||r.id}; VENDOR_KEYS.forEach(k=>o[k]=r[k]??""); o.docs=r.docs||{}; o.fileMap=r.fileMap||{}; return o; };
  const stripPriv = (obj)=>JSON.parse(JSON.stringify(obj,(k,v)=>k.startsWith("_")?undefined:v));
  const cleanQuotes = (qs)=>(qs||[]).map(q=>{ const c={}; for(const k in q){ if(!k.startsWith("_")) c[k]=q[k]; } return c; });
  const reqToRec = (r)=>({ xid:r.id, number:r.number||"", date:r.date||"", poNumber:r.poNumber||"", taxType:taxTypeOf(r), grn:r.grn||null,
    type:r.type||"purchase", currency:r.currency||CFG.CURRENCY, budgetLine:r.budgetLine||"", quoteCriteria:r.quoteCriteria||"price",
    gstApplied:r.gstApplied!==false,
    department:r.department||"", project:r.project||"", purpose:r.purpose||"",
    payee:r.payee||"", payeeVendorId:r.payeeVendorId||"", preparedBy:r.preparedBy||"", preparedDate:r.preparedDate||"",
    items:r.items||[], subTotal:Number(r.subTotal)||0, gstAmount:Number(r.gstAmount)||0, total:Number(r.total)||0,
    quotes:cleanQuotes(r.quotes), quoteJustification:r.quoteJustification||"", chain:r.chain||[],
    receipts:r.receipts||[], invoiceStatus:r.invoiceStatus||"",
    convertedFromId:r.convertedFromId||"", convertedToId:r.convertedToId||"",
    mergedIntoId:r.mergedIntoId||"", mergedFromIds:r.mergedFromIds||[],
    paymentStatus:r.paymentStatus||"unpaid", paidDate:r.paidDate||"", paidRef:r.paidRef||"",
    odooStatus:r.odooStatus||"not_posted", odooRef:r.odooRef||"", targetDays:Number(r.targetDays)||7,
    createdAtStr:r.createdAt||"", completedAt:r.completedAt||"", fileMap:r.fileMap||{} });
  const recToReq = (r)=>({ id:r.xid||r.id, number:r.number||"", date:r.date||"", poNumber:r.poNumber||"", taxType:r.taxType||(r.gstApplied===false?"none":"gst"), grn:r.grn||null,
    type:r.type||"purchase", currency:r.currency||CFG.CURRENCY, budgetLine:r.budgetLine||"", quoteCriteria:r.quoteCriteria||"price",
    gstApplied:r.gstApplied!==false,
    department:r.department||"", project:r.project||"", purpose:r.purpose||"",
    payee:r.payee||"", payeeVendorId:r.payeeVendorId||"", preparedBy:r.preparedBy||"", preparedDate:r.preparedDate||"",
    items:r.items||[], subTotal:Number(r.subTotal)||0, gstAmount:Number(r.gstAmount)||0, total:Number(r.total)||0,
    quotes:r.quotes||[], quoteJustification:r.quoteJustification||"", chain:r.chain||[],
    receipts:r.receipts||[], invoiceStatus:r.invoiceStatus||"",
    convertedFromId:r.convertedFromId||"", convertedToId:r.convertedToId||"",
    mergedIntoId:r.mergedIntoId||"", mergedFromIds:r.mergedFromIds||[],
    paymentStatus:r.paymentStatus||"unpaid", paidDate:r.paidDate||null, paidRef:r.paidRef||"",
    odooStatus:r.odooStatus||"not_posted", odooRef:r.odooRef||"", targetDays:Number(r.targetDays)||7,
    createdAt:r.createdAtStr||r.created||"", completedAt:r.completedAt||null, fileMap:r.fileMap||{} });
  const recToApproval = (r)=>({ pbId:r.id, token:r.token, reqXid:r.reqXid, stepKey:r.stepKey,
    status:r.status||"pending", approverName:r.approverName||"", comment:r.comment||"", decidedAt:r.decidedAt||"", snapshot:r.snapshot||null });

  /* ---------- load everything ---------- */
  async function loadAll(){
    const [us, vs, rs, as_] = await Promise.all([
      pb.collection(COLL.users).getFullList({ batch:200 }),
      pb.collection(COLL.vendors).getFullList({ batch:200 }),
      pb.collection(COLL.reqs).getFullList({ batch:200, sort:"-created" }),
      pb.collection(COLL.apps).getFullList({ batch:200 })
    ]);
    PBID.users={}; PBID.vendors={}; PBID.requisitions={};
    LS.users={}; LS.vendors={}; LS.requisitions={};
    DB.users = us.map(r=>{ const u=recToUser(r); PBID.users[u.id]=r.id; LS.users[u.id]=bodyStr(userToRec(u)); return u; });
    DB.vendors = vs.map(r=>{ const v=recToVendor(r); PBID.vendors[v.id]=r.id; LS.vendors[v.id]=bodyStr(vendorToRec(v)); return v; });
    DB.requisitions = rs.map(r=>{ const q=recToReq(r); PBID.requisitions[q.id]=r.id; LS.requisitions[q.id]=bodyStr(reqToRec(q)); return q; });
    DB.approvals = [];
    APPROVALS = as_.map(recToApproval);
    loaded = true;
    reconcileApprovals();
  }

  /* decisions made via magic link -> apply to the requisition chain
     (server hook does this too; this covers setups without the hook) */
  function reconcileApprovals(){
    let changed=false;
    for(const a of APPROVALS){
      if(a.status==="pending") continue;
      const r = DB.requisitions.find(x=>x.id===a.reqXid); if(!r) continue;
      const st = (r.chain||[]).find(s=>s.key===a.stepKey); if(!st) continue;
      // only open steps can take a link decision; approved/rejected are final in-app
      if(st.status!=="pending" && st.status!=="hold") continue;
      if(st.status===a.status) continue;
      st.status=a.status; st.approverName=a.approverName||st.approverName||st.sublabel;
      st.decidedAt=a.decidedAt||new Date().toISOString(); if(a.comment) st.comment=a.comment;
      maybeComplete(r); changed=true;
    }
    if(changed) window.persist();
    return changed;
  }

  /* ---------- diff-sync (persist override) ---------- */
  let syncT=null;
  window.persist = function(){
    if(!loaded) return;
    pendingSync=true; clearTimeout(syncT); syncT=setTimeout(doSync, 250);
  };

  async function doSync(){
    if(!loaded) return;
    if(syncing){ dirtyAgain=true; return; }
    syncing=true; pendingSync=false;
    try{
      await syncColl("users", DB.users, userToRec, COLL.users, {noCreate:true});
      await syncVendors();
      await syncReqs();
      await syncApprovalsOutward();
    }catch(err){ console.error("[FAM sync]", err); toast("Could not save to server — will retry on next change", 1); }
    if(window.__renumbered){ window.__renumbered=false; try{ window.persist&&localStorage; }catch(e){} refreshAll(); }
    syncing=false;
    if(dirtyAgain){ dirtyAgain=false; doSync(); }
    else if(reloadQueued){ reloadQueued=false; scheduleReload(); }
  }

  async function syncColl(key, arr, toRec, coll, opts){
    const seen={};
    for(const item of arr){
      const body=toRec(item); const s=bodyStr(body); seen[item.id]=true;
      if(!PBID[key][item.id]){
        if(opts.noCreate) continue; // auth records are created via saveUser (they need a password)
        const rec=await pb.collection(coll).create(body);
        PBID[key][item.id]=rec.id; LS[key][item.id]=s;
      } else if(LS[key][item.id]!==s){
        await pb.collection(coll).update(PBID[key][item.id], body);
        LS[key][item.id]=s;
      }
    }
    for(const xid of Object.keys(PBID[key])){
      if(!seen[xid]){
        try{ await pb.collection(coll).delete(PBID[key][xid]); }catch(e){ if(e && e.status && e.status!==404) throw e; }
        delete PBID[key][xid]; delete LS[key][xid];
      }
    }
  }

  async function syncVendors(){
    const seen={};
    for(const v of DB.vendors){
      seen[v.id]=true;
      v.fileMap=v.fileMap||{};
      let pbId=PBID.vendors[v.id];
      if(!pbId){
        const rec=await pb.collection(COLL.vendors).create(vendorToRec(v));
        pbId=rec.id; PBID.vendors[v.id]=pbId; LS.vendors[v.id]=bodyStr(vendorToRec(v));
      }
      // upload vendor documents still only in this browser's FileStore
      const pend=[];
      for(const slot of ["profile","gst"]){
        const d=v.docs&&v.docs[slot];
        if(d&&d.fileId&&!v.fileMap[d.fileId]){
          try{ const blob=await FileStore.get(d.fileId); if(blob) pend.push({d, blob}); }catch(e){}
        }
      }
      if(pend.length){
        let known=(await pb.collection(COLL.vendors).getOne(pbId)).documents||[];
        for(const pf of pend){
          const file=new File([pf.blob], pf.d.fileName||"document", {type:pf.d.fileType||"application/octet-stream"});
          const rec2=await pb.collection(COLL.vendors).update(pbId, {"documents+":file});
          const after=rec2.documents||[];
          const nn=after.find(n=>!known.includes(n));
          if(nn) v.fileMap[pf.d.fileId]=nn;
          known=after;
        }
      }
      const body=vendorToRec(v); const s=bodyStr(body);
      if(LS.vendors[v.id]!==s){ await pb.collection(COLL.vendors).update(pbId, body); LS.vendors[v.id]=s; }
    }
    for(const xid of Object.keys(PBID.vendors)){
      if(!seen[xid]){
        try{ await pb.collection(COLL.vendors).delete(PBID.vendors[xid]); }catch(e){ if(e && e.status && e.status!==404) throw e; }
        delete PBID.vendors[xid]; delete LS.vendors[xid];
      }
    }
  }

  async function syncReqs(){
    const seen={};
    for(const r of DB.requisitions){
      seen[r.id]=true;
      r.fileMap = r.fileMap||{};
      let pbId = PBID.requisitions[r.id];
      if(!pbId){
        const rec = await pb.collection(COLL.reqs).create(reqToRec(r));
        pbId = rec.id; PBID.requisitions[r.id]=pbId;
        // adopt the SERVER-assigned number (atomic admin-managed sequence) so the
        // local copy and the synced snapshot match what PocketBase stored
        if(rec.number && rec.number!==r.number){ r.number=rec.number; window.__renumbered=true; }
        LS.requisitions[r.id]=bodyStr(reqToRec(r));
      }
      // upload quote + receipt files that so far live only in this browser's FileStore
      const pending=[];
      const fileCarriers=[...(r.quotes||[]), ...(r.receipts||[])];
      for(const q of fileCarriers){
        if(q.fileId && !r.fileMap[q.fileId]){
          try{ const blob=await FileStore.get(q.fileId); if(blob) pending.push({q, blob}); }catch(e){}
        }
      }
      if(pending.length){
        let known=(await pb.collection(COLL.reqs).getOne(pbId)).attachments||[];
        for(const pf of pending){
          const file=new File([pf.blob], pf.q.fileName||"quote", {type:pf.q.fileType||"application/octet-stream"});
          const rec2=await pb.collection(COLL.reqs).update(pbId, {"attachments+":file});
          const after=rec2.attachments||[];
          const newName=after.find(n=>!known.includes(n));
          if(newName) r.fileMap[pf.q.fileId]=newName;
          known=after;
        }
      }
      const body=reqToRec(r); const s=bodyStr(body);
      if(LS.requisitions[r.id]!==s){
        await pb.collection(COLL.reqs).update(pbId, body);
        LS.requisitions[r.id]=s;
      }
    }
    for(const xid of Object.keys(PBID.requisitions)){
      if(!seen[xid]){
        try{ await pb.collection(COLL.reqs).delete(PBID.requisitions[xid]); }catch(e){ if(e && e.status && e.status!==404) throw e; }
        delete PBID.requisitions[xid]; delete LS.requisitions[xid];
        // remove any approval links that pointed at the deleted requisition
        for(const a of APPROVALS.filter(x=>x.reqXid===xid)){
          try{ await pb.collection(COLL.apps).delete(a.pbId); }catch(e){}
        }
        APPROVALS=APPROVALS.filter(x=>x.reqXid!==xid);
      }
    }
  }

  /* in-app decisions -> keep req_approvals records in step; refresh
     pending snapshots so anon approval pages show live chain state */
  async function syncApprovalsOutward(){
    for(const a of APPROVALS){
      const r=DB.requisitions.find(x=>x.id===a.reqXid); if(!r) continue;
      const st=(r.chain||[]).find(s=>s.key===a.stepKey); if(!st) continue;
      const openStates=["pending","hold"];
      if(openStates.includes(a.status) && st.status!=="pending" && st.status!==a.status){
        // decision (or hold) made in-app -> reflect on the link record
        const body={ status:st.status, approverName:st.approverName||"", comment:st.comment||"", decidedAt:st.decidedAt||"" };
        await pb.collection(COLL.apps).update(a.pbId, body);
        Object.assign(a, body);
      } else if(openStates.includes(a.status)){
        const snap=makeSnapshot(r, st);
        if(bodyStr(snap)!==bodyStr(a.snapshot||{})){
          await pb.collection(COLL.apps).update(a.pbId, { snapshot:snap });
          a.snapshot=snap;
        }
      }
    }
  }

  /* reopenStep() calls this BEFORE clearing the chain step, so a decided/held
     link record goes back to pending and can be used again */
  window.__reopenApproval = async function(r, st){
    const a=APPROVALS.find(x=>x.token===st.token); if(!a) return;
    const body={ status:"pending", approverName:"", comment:"", decidedAt:"" };
    await pb.collection(COLL.apps).update(a.pbId, body);
    Object.assign(a, body);
  };

  /* AI quote extraction — sends the picked document to the PB hook, which
     calls the AI server-side (API key never reaches the browser) */
  window.__parseQuote = async function(file){
    const b64 = await new Promise((res, rej)=>{
      const fr=new FileReader();
      fr.onload=()=>res(String(fr.result).split(",")[1]||"");
      fr.onerror=rej;
      fr.readAsDataURL(file);
    });
    return await pb.send("/api/fam/parse-quote", { method:"POST", body:{ name:file.name, type:file.type, data:b64 } });
  };

  /* server URL for a synced attachment (used by print + openFile) */
  window.__fileUrl = function(r, fileId){
    if(r && r.fileMap && r.fileMap[fileId] && PBID.requisitions[r.id])
      return window.PB_URL+"/api/files/"+COLL.reqs+"/"+PBID.requisitions[r.id]+"/"+r.fileMap[fileId];
    return null;
  };

  /* what the anonymous approval page is allowed to see (no step tokens!) */
  function makeSnapshot(r, st){
    return {
      number:r.number, date:r.date, department:r.department, project:r.project||"", purpose:r.purpose,
      type:r.type||"purchase", currency:r.currency||CFG.CURRENCY, budgetLine:r.budgetLine||"", quoteCriteria:r.quoteCriteria||"price",
      gstApplied:r.gstApplied!==false,
      payee:reqPayeeName(r), preparedBy:r.preparedBy,
      items:r.items||[], subTotal:r.subTotal, gstAmount:r.gstAmount, total:r.total,
      quoteJustification:r.quoteJustification||"",
      quotes:(r.quotes||[]).map(q=>({ id:q.id, vendorId:"", vendorName:quoteName(q), amount:q.amount, deliveryDays:q.deliveryDays||null, note:q.note||"", selected:!!q.selected,
        fileId:q.fileId||null, fileName:q.fileName||"", fileType:q.fileType||"",
        fileUrl:(q.fileId && r.fileMap && r.fileMap[q.fileId] && PBID.requisitions[r.id])
          ? (window.PB_URL+"/api/files/"+COLL.reqs+"/"+PBID.requisitions[r.id]+"/"+r.fileMap[q.fileId]) : "" })),
      chain:(r.chain||[]).map(s=>({ key:s.key, label:s.label, sublabel:s.sublabel, approverRole:s.approverRole,
        status:s.status, approverName:s.approverName||"", comment:s.comment||"", decidedAt:s.decidedAt||null })),
      stepKey:st.key
    };
  }

  async function ensureApprovalRecord(r, st){
    let a=APPROVALS.find(x=>x.token===st.token);
    const snap=makeSnapshot(r, st);
    try{
      if(!a){
        const rec=await pb.collection(COLL.apps).create({ token:st.token, reqXid:r.id, stepKey:st.key, status:"pending",
          approverName:st.approverName||"", comment:"", decidedAt:"", snapshot:snap });
        APPROVALS.push(recToApproval(rec));
      } else if(a.status==="pending" && bodyStr(a.snapshot||{})!==bodyStr(snap)){
        await pb.collection(COLL.apps).update(a.pbId, { snapshot:snap });
        a.snapshot=snap;
      }
    }catch(e){ console.error(e); toast("Could not prepare approval link — check your connection", 1); }
  }

  /* ---------- files: fall back to the server copy ---------- */
  const ANON_FILEURLS={};
  const _openFile = window.openFile;
  window.openFile = async function(fileId, fileName, fileType){
    try{ const blob=await FileStore.get(fileId); if(blob) return _openFile(fileId, fileName, fileType); }catch(e){}
    // Anonymous approval page: fetch the protected file through the scoped
    // proxy route (validates the link token maps to this requisition's file).
    if(ANON_FILEURLS[fileId]){
      const _seg=ANON_FILEURLS[fileId].split("?")[0].split("/");
      const _fname=_seg[_seg.length-1];
      const _tk=(typeof ANON!=="undefined"&&ANON&&ANON.tok)?ANON.tok:"";
      window.open(window.PB_URL+"/api/fam/approval-file?t="+encodeURIComponent(_tk)+"&f="+encodeURIComponent(_fname), "_blank");
      return;
    }
    // Authed staff: attachments are PROTECTED now, so a raw URL 404s — resolve
    // the base URL, then fetch a short-lived file token and append it.
    let base="";
    for(const r of DB.requisitions){
      if(r.fileMap && r.fileMap[fileId] && PBID.requisitions[r.id]){ base=window.PB_URL+"/api/files/"+COLL.reqs+"/"+PBID.requisitions[r.id]+"/"+r.fileMap[fileId]; break; }
    }
    if(!base){ for(const v of DB.vendors){
      if(v.fileMap && v.fileMap[fileId] && PBID.vendors[v.id]){ base=window.PB_URL+"/api/files/"+COLL.vendors+"/"+PBID.vendors[v.id]+"/"+v.fileMap[fileId]; break; }
    } }
    if(!base){ toast("File not found", 1); return; }
    // Open the tab synchronously (before the await) so popup blockers don't eat it.
    const w=window.open("", "_blank");
    let ft=""; try{ ft=await pb.files.getToken(); }catch(e){}
    const url=base+(ft?("?token="+encodeURIComponent(ft)):"");
    if(w){ w.location.href=url; } else { window.open(url, "_blank"); }
  };

  function renderAnonCard(a, tok){
    const snap=a.snapshot;
    const r={ number:snap.number, purpose:snap.purpose, department:snap.department, project:snap.project||"", date:snap.date,
      type:snap.type||"purchase", currency:snap.currency||CFG.CURRENCY, budgetLine:snap.budgetLine||"", quoteCriteria:snap.quoteCriteria||"price",
      gstApplied:snap.gstApplied!==false,
      items:snap.items||[], subTotal:snap.subTotal, gstAmount:snap.gstAmount, total:snap.total,
      quotes:snap.quotes||[], quoteJustification:snap.quoteJustification||"",
      chain:(snap.chain||[]).map(s=>Object.assign({},s)) };
    const st=r.chain.find(s=>s.key===snap.stepKey)||r.chain[0]||{};
    st.token=tok;
    if(a.status && a.status!=="pending"){ st.status=a.status; st.approverName=a.approverName||st.approverName; st.decidedAt=a.decidedAt||st.decidedAt; }
    (snap.quotes||[]).forEach(q=>{ if(q.fileId && q.fileUrl) ANON_FILEURLS[q.fileId]=q.fileUrl; });
    ANON={ a, r, st, tok };
    renderApprovalCard(r, st, false);
  }
  const _apDecide = window.apDecide;
  window.apDecide = async function(tok, decision){
    if(ME && findByToken(tok)) return _apDecide(tok, decision);
    if(!ANON || ANON.tok!==tok) return;
    const comment=$("#apComment")?$("#apComment").value.trim():"";
    if(decision==="hold" && !comment){ toast("Please add a note explaining why this is on hold",1); return; }
    // signer identity is fixed when the link is issued — the anonymous page
    // cannot change who it is signed by (enforced by the API rule too)
    const body={ status:decision==="approve"?"approved":decision==="hold"?"hold":"rejected",
      comment:comment||(decision==="reject"?"Rejected via approval link":""),
      decidedAt:new Date().toISOString() };
    try{
      await pb.collection(COLL.apps).update(ANON.a.pbId, body, { query:{ t:tok } });
      Object.assign(ANON.a, body);
      renderAnonCard(ANON.a, tok);
      toast(decision==="approve"?"Approved — thank you":decision==="hold"?"Put on hold":"Rejected");
    }catch(e){ console.error(e); toast("Could not submit — this link may already have been used", 1); }
  };

  /* ---------- realtime ---------- */
  let reloadT=null;
  function scheduleReload(){
    clearTimeout(reloadT);
    reloadT=setTimeout(async ()=>{
      if(syncing||pendingSync){ reloadQueued=true; return; }
      try{ await loadAll(); if(ME) refreshAll(); }catch(e){ console.error(e); }
    }, 400);
  }
  function subscribeRealtime(){
    try{
      pb.collection(COLL.reqs).subscribe("*", scheduleReload);
      pb.collection(COLL.apps).subscribe("*", scheduleReload);
      pb.collection(COLL.vendors).subscribe("*", scheduleReload);
      pb.collection(COLL.users).subscribe("*", scheduleReload);
    }catch(e){ console.error(e); }
  }

  /* ---------- boot ---------- */
  function showLogin(){ $("#approvePage").style.display="none"; $("#app").style.display="none"; $("#login").style.display="flex"; }
  window.renderLogin();
  const bootTok=new URLSearchParams(location.search).get("approve");
  if(bootTok && !pb.authStore.isValid){
    routeApprovalLive(bootTok);
  } else if(pb.authStore.isValid){
    try{
      await pb.collection(COLL.users).authRefresh();
      await enterApp();
      if(bootTok) window.routeApproval(bootTok, false);
    }catch(e){ console.error(e); try{ pb.authStore.clear(); }catch(x){} showLogin(); }
  } else {
    showLogin();
  }
}
</script>

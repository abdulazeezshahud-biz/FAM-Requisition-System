server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (see fam-security-headers.conf). Repeated inside every
    # location that sets its own add_header, because nginx REPLACES (does not
    # merge) inherited add_headers once a location declares any of its own —
    # otherwise index.html / sw.js / manifest / icons would ship with none.
    include /etc/nginx/fam-security-headers.conf;

    # HTML: never cache (so updates roll out instantly)
    location = /index.html {
        include /etc/nginx/fam-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /manifest.json {
        include /etc/nginx/fam-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # Runtime backend-URL config: never cache (regenerated per deployment).
    location = /config.js {
        include /etc/nginx/fam-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    # Service worker: never cache the SW script itself, so updates roll out.
    location = /sw.js {
        include /etc/nginx/fam-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Icons: long cache
    location ~* \.(svg|png|ico|webp)$ {
        include /etc/nginx/fam-security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # SPA-style: any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}

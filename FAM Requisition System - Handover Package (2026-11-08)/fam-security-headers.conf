# Shared security headers for the FAM Requisition app.
# Included at server scope AND inside every location that sets its own
# add_header (nginx replaces — does not merge — inherited add_headers when a
# location declares any of its own, so this must be repeated per-location).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: single inline app script (unsafe-inline), dynamic PocketBase SDK import
# from jsDelivr, Google Fonts, and https PocketBase API + SSE (connect-src).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:;" always;
